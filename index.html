iculty": "Straightforward"}, {"stem": "After login, the system checks which folders a user may open and whether they can edit or only read them. This step is:", "options": ["Identification", "Authentication", "Authorization", "Accounting"], "answer": 2, "explanation": "authentication proves who you are; authorization decides what you're permitted to do.", "difficulty": "Straightforward"}, {"stem": "An access control model that grants or denies access based on attributes such as the user's department, location, and the time of day is:", "options": ["DAC", "MAC", "RBAC", "ABAC"], "answer": 3, "explanation": "Attribute-Based Access Control evaluates attributes of the subject, object, and environment — not just roles or owners.", "difficulty": "Straightforward"}, {"stem": "A team member shares a project document from their personal drive and allows viewers to re-share it with others. This reflects which model?", "options": ["MAC", "DAC", "RBAC", "ABAC"], "answer": 1, "explanation": "the resource owner decides who gets access at their own discretion — the hallmark of Discretionary Access Control.", "difficulty": "Straightforward"}, {"stem": "Five system administrators share one \"root\" password for a critical server. The BIGGEST problem with this practice is the loss of:", "options": ["Availability", "Accountability", "Confidentiality", "Encryption"], "answer": 1, "explanation": "with a shared credential, actions cannot be traced back to an individual — accountability is destroyed.", "difficulty": "Straightforward"}, {"stem": "Under mandatory access control, a researcher writes a report classified \"Secret\". A colleague with \"Confidential\" clearance asks the researcher to share it. What is true?", "options": ["The researcher may share it since they wrote it", "The researcher cannot grant access — labels are enforced by the system, not the owner", "Sharing is allowed with read-only rights", "The colleague's manager can override the label"], "answer": 1, "explanation": "in MAC a central authority's labels decide access; even the creator cannot override or delegate them.", "difficulty": "Straightforward"}, {"stem": "A company hires 20 temporary contractors for a three-month project, all needing identical system access. The MOST efficient approach is to:", "options": ["Copy one employee's full profile to each contractor", "Create a project role with the needed permissions and assign all contractors to it", "Give each contractor administrator rights", "Let each contractor request access individually from file owners"], "answer": 1, "explanation": "RBAC assigns users to a role — consistent permissions that are easy to grant in bulk and revoke when the project ends. Copying profiles causes privilege creep.", "difficulty": "Straightforward"}, {"stem": "A bank requires two different employees to approve any firewall rule change — one proposes, another approves. This enforces:", "options": ["Least privilege", "Separation of duties", "Defense in depth", "Implicit deny"], "answer": 1, "explanation": "no single person can complete the sensitive change alone, which reduces fraud and catches errors.", "difficulty": "Straightforward"}, {"stem": "Every quarter, managers review and confirm their team members' access rights, removing anything no longer needed. This practice primarily helps prevent:", "options": ["Phishing", "Privilege creep", "Tailgating", "Password reuse"], "answer": 1, "explanation": "periodic access recertification catches permissions that quietly accumulated beyond a user's current role.", "difficulty": "Straightforward"}, {"stem": "A workstation automatically locks after 10 minutes of inactivity. This is an example of a:", "options": ["Physical preventive control", "Logical control limiting the window of unauthorized use", "Administrative corrective control", "Detective control"], "answer": 1, "explanation": "it is enforced by software (logical/technical) and prevents — not merely detects — misuse if the user walks away.", "difficulty": "Straightforward"}, {"stem": "Which statement about defense in depth is TRUE?", "options": ["It guarantees no breach can ever occur", "It relies on a single, very strong control", "It protects against both insider and external threats through layered controls", "It only applies to network security"], "answer": 2, "explanation": "stacked layers compensate for each other's failures across multiple threat sources — but no approach eliminates all risk.", "difficulty": "Straightforward"}, {"stem": "A fingerprint reader used to log in to a laptop is an example of a ______ access control.", "options": ["Physical", "Logical", "Administrative", "Compensating"], "answer": 1, "explanation": "although biometric, it is enforced by software to grant system access — a logical control. The same reader on a server-room door would be physical.", "difficulty": "Straightforward"}, {"stem": "A sign-in sheet at the reception desk that every visitor must complete is primarily which type of control?", "options": ["Physical", "Logical", "Administrative", "Technical"], "answer": 2, "explanation": "tricky — it's a procedure/record governing people's behavior (administrative), even though it sits at a physical entrance.", "difficulty": "Straightforward"}, {"stem": "A biometric door system repeatedly fails to recognize an authorized employee whose finger is wet, denying them entry. This is a:", "options": ["False acceptance", "False rejection", "Crossover error", "Enrollment failure"], "answer": 1, "explanation": "a legitimate user wrongly rejected = false rejection (Type I error). False acceptance would wrongly admit an impostor — the more dangerous failure.", "difficulty": "Straightforward"}]}, {"id": 4, "name": "Network Security", "notes": "# Domain 4: Network Security — Study Notes\n### ISC2 CC (Certified in Cybersecurity) Exam Prep\n\n> Paraphrased study notes with extra explanations and examples. This is the biggest technical domain — networking basics, threats, defenses, and cloud.\n\n---\n\n## 1. Networking Models — OSI (7 layers) vs TCP/IP (4 layers)\n\n**Memorize the OSI layers top-to-bottom with the mnemonic: \"All People Seem To Need Data Processing\"**\n\n| # | OSI Layer | What it does | Devices / examples |\n|---|---|---|---|\n| 7 | **Application** | Interface for user software (email, web, file transfer) | HTTP, FTP, SMTP, DNS |\n| 6 | **Presentation** | Data formatting, translation, **encryption/decryption**, compression | SSL/TLS, JPEG, ASCII |\n| 5 | **Session** | Establishes, manages, terminates connections between apps | NetBIOS, session tokens |\n| 4 | **Transport** | Reliable end-to-end delivery; segmentation, error checking | **TCP** (reliable) vs **UDP** (fast); port numbers live here |\n| 3 | **Network** | Logical addressing (**IP**) and **routing** | **Routers**, IP addresses |\n| 2 | **Data Link** | Physical addressing (**MAC**), framing | **Switches**, bridges, MAC addresses |\n| 1 | **Physical** | Raw bits over cables/signals | Hubs, cables, repeaters |\n\n**TCP/IP model (4 layers) — what the internet actually uses:**\n- **Application** = OSI layers 7+6+5 (HTTP, FTP, SMTP, DNS)\n- **Transport** = OSI layer 4 (TCP/UDP)\n- **Internet** = OSI layer 3 (IP, ICMP, routing)\n- **Link / Network Access** = OSI layers 2+1 (hardware, MAC, framing)\n\n### TCP vs UDP\n| | **TCP** | **UDP** |\n|---|---|---|\n| Connection | Connection-oriented (handshake first) | Connectionless (just sends) |\n| Reliability | Reliable — acknowledgments + retransmission | Unreliable — no guarantee |\n| Speed | Slower | Faster |\n| Use | Web browsing, email, file transfer | Streaming, gaming, DNS, VoIP |\n\n### The three-way handshake (TCP connection setup)\n**SYN → SYN-ACK → ACK.** Sender says \"can we talk?\" (SYN) → receiver says \"yes, and can you hear me?\" (SYN-ACK) → sender says \"loud and clear\" (ACK) → connection established. This handshake is WHY TCP is reliable and connection-oriented.\n\n### IPv4 vs IPv6\n- **IPv4:** 32-bit addresses (e.g., 192.168.1.1), ~4.3 billion addresses — **running out**, which drove IPv6.\n- **IPv6:** 128-bit addresses (8 hex groups) — vastly larger space, plus autoconfiguration.\n\n---\n\n## 2. Ports and Secure Protocols — memorize this table\n\n| Port | Service | Secure replacement |\n|---|---|---|\n| 20/21 TCP | FTP | SFTP / FTPS |\n| **22 TCP** | **SSH** | (replaces Telnet) |\n| 23 TCP | Telnet (insecure, plaintext!) | SSH |\n| 25 TCP | SMTP | — |\n| 53 TCP/UDP | DNS | — |\n| 67/68 UDP | DHCP | — |\n| 69 UDP | TFTP | — |\n| **80 TCP** | **HTTP** | HTTPS |\n| 110 TCP | POP3 | — |\n| 123 UDP | NTP | — |\n| 143 TCP | IMAP | — |\n| 161/162 UDP | SNMP | **SNMPv3** |\n| 389 TCP/UDP | LDAP | **LDAPS** |\n| **443 TCP** | **HTTPS** | (secure HTTP) |\n| 445 TCP | SMB | — |\n| 3389 TCP | RDP | — |\n\n**Port ranges:** Well-known 0–1023 · Registered 1024–49151 · Dynamic/private 49152–65535.\n\n*Exam logic:* \"Which protocol securely replaces Telnet?\" → SSH (port 22). \"Secure version of SNMP?\" → SNMPv3. Firewalls filter traffic largely by these ports — knowing them tells you what's exposed.\n\n---\n\n## 3. Threats and the Tools That Fight Them\n\n### Threat categories\n- **Malware:** viruses, worms, trojans, ransomware, spyware\n- **Social engineering:** phishing, pretexting, baiting\n- **Network attacks:** DoS/DDoS, man-in-the-middle, spoofing\n- **Insider threats** and **APTs** (advanced persistent threats — long-term, stealthy, often state-sponsored)\n\n### The defensive toolkit — know each tool's job AND control type\n| Tool | Job | Control type |\n|---|---|---|\n| **Firewall** | Filters traffic by rules (allow/deny) | **Preventive** |\n| **IDS** (Intrusion Detection System) | Monitors traffic, **alerts** on suspicious activity (does NOT block) | **Detective** |\n| **IPS** (Intrusion Prevention System) | Detects AND **blocks** malicious traffic (sits inline) | **Preventive** |\n| **Antivirus/antimalware** | Detects and removes malicious programs on endpoints | Preventive/corrective |\n| **Vulnerability scanner** | Finds unpatched weaknesses to fix | Detective |\n| **SIEM** | Collects and **correlates logs** from many sources to spot attack patterns | Detective |\n\n**IDS details:** NIDS (network-based — watches traffic) vs HIDS (host-based — watches one machine). Detection methods: **signature-based** (known attack patterns) vs **anomaly-based** (deviations from normal baseline) vs heuristic.\n\n*Classic exam trap:* \"Which device detects an intrusion and alerts the admin but does not block it?\" → IDS. \"Which blocks it?\" → IPS.\n\n### Identifying threats (what analysts actually do)\nContinuous monitoring: review firewall/server/app logs → IDS alerts on signatures or baseline deviations → vulnerability scans → **threat intelligence feeds** (info on new attacks/IOCs seen elsewhere) → look for anomalies (logins at 3 AM, huge outbound transfers, repeated failed logins) → **correlate across sources (SIEM)** → keep signatures and intel updated.\n\n### Wi-Fi note\nWireless is convenient but attackable **at a distance** — wired attacks need physical proximity (cable taps), wireless attacks don't. That's the core trade-off.\n\n---\n\n## 4. Network Design for Security\n\n### Defense in depth (network version)\nLayers: **perimeter** (firewall) → **network** (IDS/IPS, segmentation) → **host** (antivirus, hardening) → **application** (secure coding, WAF) → **data** (encryption, DLP). Same castle idea, applied to networks.\n\n### Zero Trust\n**\"Never trust, always verify.\"** No implicit trust based on *where* you are (inside the office ≠ trustworthy). Every request is authenticated, authorized, and continuously validated. Uses least privilege + microsegmentation + \"assume breach\" mindset. Replaces the old \"hard shell, soft center\" perimeter model.\n\n### DMZ (Demilitarized Zone)\nA **buffer network** between the untrusted internet and the trusted internal network. Public servers (web, mail, DNS) live here.\n**Traffic flow:** Internet → outer firewall → DMZ → inner firewall → internal network. Internet can reach DMZ services but NEVER the internal network directly. If a DMZ server is compromised, the inner firewall still protects internal systems. DMZ hosts are hardened, patched fast, and watched closely.\n\n### Segmentation types\n| Type | What it is |\n|---|---|\n| **VLAN** | Logically splits one physical network into separate broadcast domains; inter-VLAN traffic must pass through a router/firewall. Groups by function (Finance, HR, Guest) not location. |\n| **Microsegmentation** | Many tiny segments down to individual workloads/VMs, each with its own policy — drastically limits **lateral movement**. Key zero-trust enabler, usually software-defined. |\n| **IoT segmentation** | IoT devices (cameras, printers, sensors) have weak security (default passwords, unpatchable) — isolate them on their own segment so a hacked camera can't reach servers. |\n\n**VLAN hopping** (attack jumping between VLANs) is prevented with secure switch configuration.\n\n### NAC (Network Access Control)\nDecides which **devices** may join the network based on policy: is the user authenticated (often **802.1X**)? Is the OS patched? Is antivirus present? Compliant → appropriate access. Non-compliant → **quarantine VLAN** (remediation only) or denied. Guests → isolated internet-only. A practical implementation of zero trust.\n\n### VPN — read carefully\nA VPN is a **point-to-point connection** between two hosts — it is NOT automatically encrypted. Secure communication happens **only if security protocols are selected and correctly configured** to create a trusted path over an untrusted network. Gateway-to-gateway VPNs replace expensive dedicated links for site-to-site connections.\n\n---\n\n## 5. Redundancy and Data Centers\n\n**Redundancy** = duplicating critical components so another takes over on failure → supports **availability**, eliminates **single points of failure**. Applies to power (UPS, generators, dual feeds), network links, servers (clustering), storage (RAID), data (backups), sites.\n\n*E-commerce example:* multiple web servers behind a **load balancer** (one dies, traffic shifts silently) + database replicated to standby + dual ISPs + UPS + generator. Redundancy at every layer = **high availability**.\n\n**On-premises data center needs:** environmental controls (cooling, humidity), fire suppression (**clean-agent** systems that don't damage electronics), power redundancy (UPS + generators + dual utility feeds), physical security (badges, mantraps, cameras, guards), redundant network links, continuous monitoring.\n\n---\n\n## 6. Cloud Computing\n\n### NIST's 5 essential characteristics\n1. **On-demand self-service** 2. **Broad network access** 3. **Resource pooling** (multi-tenancy) 4. **Rapid elasticity** 5. **Measured service** (pay for use)\n\n### Service models — who manages what (exam favorite)\n| Model | Provider manages | Customer manages | Example |\n|---|---|---|---|\n| **IaaS** | Virtualized hardware (VMs, storage, network) | OS, apps, data | AWS EC2 |\n| **PaaS** | Platform (OS, runtime, databases) | Just their apps/data | Heroku, Google App Engine |\n| **SaaS** | Everything — complete app | Just uses it | Gmail, Salesforce, Office 365 |\n\nMemory aid: as you go IaaS → PaaS → SaaS, the customer manages LESS.\n\n### Deployment models\n- **Public:** shared, multi-tenant, over the internet — cheapest, least control.\n- **Private:** dedicated to one org — most control, highest cost.\n- **Hybrid:** mix — sensitive workloads private, elastic workloads public.\n- **Community:** shared by orgs with common concerns (e.g., government, healthcare).\n\n### Shared responsibility model\nThe provider secures **the cloud itself** (physical infrastructure); the customer secures **what's IN the cloud** (data, access, configuration). Misconfigurations are the customer's fault — e.g., leaving a storage bucket public.\n\n**Cloud redundancy:** providers replicate across **availability zones** (separate locations, independent power/network) with automatic failover; multi-region replication for disasters. Customer still must configure it correctly.\n\n### Contracts and third parties\n- **SLA (Service-Level Agreement):** contract defining expected service (e.g., 99.9% uptime) + penalties if missed. Makes promises measurable.\n- **MOU:** preliminary, generally **not legally binding** — expresses intent to cooperate.\n- **MOA:** more formal, **can be legally binding** — spells out responsibilities.\n- **MSP (Managed Service Provider):** third party managing your IT remotely (monitoring, patching, help desk) — vet them carefully; they get deep access.\n\n---\n\n## Practice Questions — Domain 4\n\n**Q1.** Which OSI layer handles logical addressing (IP) and routing?\na) Data Link · b) Transport · **c) Network** ✓ · d) Session\n\n**Q2.** Switches operate at which OSI layer?\na) Layer 1 · **b) Layer 2** ✓ · c) Layer 3 · d) Layer 4\n\n**Q3.** The correct order of the TCP three-way handshake is:\na) ACK → SYN → SYN-ACK · **b) SYN → SYN-ACK → ACK** ✓ · c) SYN-ACK → SYN → ACK · d) SYN → ACK → SYN-ACK\n\n**Q4.** Which protocol is connectionless and faster, commonly used for streaming and DNS?\na) TCP · **b) UDP** ✓ · c) IP · d) ICMP\n\n**Q5.** SSH uses which port, and what does it securely replace?\na) Port 23, replaces FTP · **b) Port 22, replaces Telnet** ✓ · c) Port 443, replaces HTTP · d) Port 25, replaces SMTP\n\n**Q6.** An IDS differs from an IPS in that the IDS:\na) Blocks malicious traffic · **b) Detects and alerts but does not block** ✓ · c) Filters traffic by port rules · d) Encrypts traffic\n\n**Q7.** A DMZ is best described as:\na) An encrypted tunnel · **b) A buffer network between the internet and the internal network** ✓ · c) A type of firewall · d) A backup data center\n\n**Q8.** \"Never trust, always verify\" is the core principle of:\na) Defense in depth · **b) Zero trust** ✓ · c) DMZ · d) NAC\n\n**Q9.** In the shared responsibility model, the customer is responsible for:\na) Physical security of data centers · **b) Securing their data and configurations in the cloud** ✓ · c) Network cabling · d) Hypervisor patching\n\n**Q10.** Which cloud deployment model is shared by organizations with common concerns, such as government agencies?\na) Public · b) Private · c) Hybrid · **d) Community** ✓\n\n**Q11.** IaaS, PaaS, SaaS in order of DECREASING customer management responsibility:\na) SaaS → PaaS → IaaS · **b) IaaS → PaaS → SaaS** ✓ · c) PaaS → IaaS → SaaS · d) IaaS → SaaS → PaaS\n\n**Q12.** A non-compliant device (missing patches, no antivirus) tries to join the network. Under NAC it would most likely be:\na) Granted full access · **b) Placed in a quarantine VLAN or denied** ✓ · c) Given admin rights · d) Ignored\n\n**Q13.** Microsegmentation primarily limits:\na) Internet speed · **b) Lateral movement of attackers** ✓ · c) Cloud costs · d) Email spam\n\n**Q14.** Which is generally NOT legally binding and expresses intent to cooperate?\na) SLA · **b) MOU** ✓ · c) MOA · d) Contract\n\n**Q15.** Why are IoT devices typically placed on isolated network segments?\na) They use too much bandwidth · **b) They often have weak security and the blast radius must be limited** ✓ · c) They require public IPs · d) They only work on VLANs\n\n### Answers\n1-c, 2-b, 3-b, 4-b, 5-b, 6-b, 7-b, 8-b, 9-b, 10-d, 11-b, 12-b, 13-b, 14-b, 15-b\n\n---\n\n*Saved: 2026-09-19. Source: ISC2 CC Online Self-Paced Training, Domain 4 (paraphrased notes + original practice questions).*\n", "questions": [{"stem": "At which OSI layer do MAC addresses operate?", "options": ["Layer 1", "Layer 2", "Layer 3", "Layer 4"], "answer": 1, "explanation": "Layer 2 (Data Link) handles physical/MAC addressing and framing; Layer 3 handles IP addresses.", "difficulty": "Straightforward"}, {"stem": "Which port does DNS primarily use?", "options": ["25", "80", "53", "443"], "answer": 2, "explanation": "DNS uses port 53 (both UDP and TCP); 25 is SMTP, 80 is HTTP, 443 is HTTPS.", "difficulty": "Straightforward"}, {"stem": "A ransomware attack encrypts company files and demands payment. Ransomware is BEST classified as:", "options": ["Social engineering", "Malware", "A vulnerability", "A threat vector"], "answer": 1, "explanation": "Ransomware is malicious software (malware); the attack type (how it arrives) may be phishing, but the code itself is malware.", "difficulty": "Straightforward"}, {"stem": "Which firewall generation inspects the state of active connections rather than just packet headers?", "options": ["Packet-filtering firewall", "Stateful inspection firewall", "Circuit-level gateway", "Application-level gateway"], "answer": 1, "explanation": "Stateful firewalls track connection state (SYN, ACK, established) to judge context, unlike basic packet filters that judge each packet alone.", "difficulty": "Straightforward"}, {"stem": "FTP transmits credentials in plaintext. Which secure alternative encrypts the session AND typically uses port 22?", "options": ["FTPS", "SFTP", "TFTP", "HTTPS"], "answer": 1, "explanation": "SFTP runs over SSH (port 22) and encrypts the entire session; FTPS adds TLS to FTP but uses different ports; TFTP is insecure.", "difficulty": "Straightforward"}, {"stem": "In the TCP/IP model, the Internet layer corresponds to which OSI layer?", "options": ["Data Link", "Transport", "Network", "Session"], "answer": 2, "explanation": "TCP/IP's Internet layer (IP, routing) maps to OSI Layer 3, the Network layer.", "difficulty": "Straightforward"}, {"stem": "An attacker floods a web server with traffic from thousands of compromised devices until it crashes. This is a:", "options": ["DDoS attack", "Man-in-the-middle attack", "SQL injection", "Logic bomb"], "answer": 0, "explanation": "Traffic flooding from many sources to deny service = Distributed Denial of Service (DDoS).", "difficulty": "Straightforward"}, {"stem": "Which device connects two DIFFERENT networks and makes forwarding decisions based on IP addresses?", "options": ["Switch", "Hub", "Router", "Bridge"], "answer": 2, "explanation": "Routers operate at Layer 3 and route between networks using IP addresses; switches/bridges work at Layer 2 within a network.", "difficulty": "Straightforward"}, {"stem": "HTTPS differs from HTTP PRIMARILY because it:", "options": ["Uses port 80", "Is faster", "Encrypts data in transit using TLS", "Requires no certificate"], "answer": 2, "explanation": "HTTPS = HTTP over TLS (port 443), adding encryption, integrity, and server authentication.", "difficulty": "Straightforward"}, {"stem": "A company wants employees working from home to access the internal network securely over the internet. The BEST solution is:", "options": ["Open all firewall ports", "A VPN", "A DMZ", "Port forwarding"], "answer": 1, "explanation": "A VPN creates a secure tunnel over an untrusted network for remote access; opening ports or port forwarding increases exposure.", "difficulty": "Straightforward"}, {"stem": "Which type of IDS compares current activity against a baseline of normal behavior?", "options": ["Anomaly-based IDS", "Signature-based IDS", "Host-based firewall", "Proxy server"], "answer": 0, "explanation": "Anomaly-based detection flags deviations from a learned baseline; signature-based detection matches known attack patterns.", "difficulty": "Straightforward"}, {"stem": "An email claims to be from the CEO asking finance to wire money urgently. This attack is known as:", "options": ["Smishing", "Vishing", "Whaling / business email compromise", "Pharming"], "answer": 2, "explanation": "Targeting high-level executives (the \"big fish\") with fraudulent transfer requests is whaling, a form of spear phishing/BEC.", "difficulty": "Straightforward"}, {"stem": "Which cloud model gives the customer the MOST control over the underlying infrastructure?", "options": ["IaaS", "PaaS", "SaaS", "They are identical"], "answer": 0, "explanation": "In IaaS the customer manages OS, apps, and data (only hardware is virtualized by the provider); PaaS and SaaS shift more responsibility to the provider.", "difficulty": "Straightforward"}, {"stem": "DHCP is used to:", "options": ["Resolve domain names to IPs", "Automatically assign IP addresses to devices", "Encrypt web traffic", "Transfer files"], "answer": 1, "explanation": "DHCP (ports 67/68 UDP) dynamically leases IP addresses; DNS resolves names, TLS encrypts, FTP transfers files.", "difficulty": "Straightforward"}, {"stem": "A firewall rule blocks all traffic except explicitly permitted services. This approach is called:", "options": ["Default deny (implicit deny)", "Default allow", "Least privilege", "Fail open"], "answer": 0, "explanation": "\"Deny everything, allow only what's needed\" is the default-deny/implicit-deny posture — the secure baseline for firewall rulesets.", "difficulty": "Straightforward"}, {"stem": "A network sniffer captures login credentials on a coffee-shop Wi-Fi. The attacker MOST likely performed a:", "options": ["DDoS attack", "Man-in-the-middle attack", "Rootkit installation", "Logic bomb"], "answer": 1, "explanation": "Intercepting traffic between the victim and the network (e.g., via a rogue access point) to steal credentials is a MitM attack.", "difficulty": "Straightforward"}, {"stem": "Which of the following is a connectionless protocol with NO delivery guarantees?", "options": ["TCP", "UDP", "TLS", "SSH"], "answer": 1, "explanation": "UDP sends datagrams without handshakes, acknowledgments, or retransmission — fast but unreliable; TCP, TLS, and SSH all provide reliability.", "difficulty": "Straightforward"}, {"stem": "An organization hosts its public web server where the internet can reach it, but a compromise of that server must not expose internal systems. It should place the server in a:", "options": ["VPN", "VLAN trunk", "DMZ", "Honeynet"], "answer": 2, "explanation": "A DMZ is a buffer zone between the internet and the internal network — public servers live there, protected by inner and outer firewalls.", "difficulty": "Straightforward"}, {"stem": "In a shared responsibility model for IaaS, who is responsible for patching the guest operating system?", "options": ["The cloud provider", "The customer", "The ISP", "No one — it's automatic"], "answer": 1, "explanation": "IaaS customers manage everything above the virtualized hardware, including the guest OS; the provider secures only the physical infrastructure and hypervisor.", "difficulty": "Straightforward"}, {"stem": "Which control type is a firewall?", "options": ["Detective", "Corrective", "Preventive", "Deterrent"], "answer": 2, "explanation": "Firewalls block unauthorized traffic before it enters — they prevent incidents rather than merely detecting or fixing them.", "difficulty": "Straightforward"}, {"stem": "A worm spreads across the network by exploiting a vulnerability WITHOUT any user action, while a virus needs a host program and user execution. Given this, which statement is TRUE?", "options": ["Viruses spread faster than worms", "Worms can propagate automatically across networks", "Worms need email attachments to spread", "Both require the user to run an infected file"], "answer": 1, "explanation": "Worms are self-replicating and network-propagating by design; viruses require a host file and user action to execute.", "difficulty": "Straightforward"}, {"stem": "A hospital shares a cloud environment with other hospitals that have the same regulatory requirements. This deployment model is:", "options": ["Public cloud", "Private cloud", "Hybrid cloud", "Community cloud"], "answer": 3, "explanation": "Community clouds serve organizations with shared concerns (mission, compliance) — e.g., healthcare or government groups.", "difficulty": "Straightforward"}, {"stem": "Which port and protocol combination is used for secure remote command-line administration?", "options": ["23 / Telnet", "22 / SSH", "3389 / RDP", "21 / FTP"], "answer": 1, "explanation": "SSH on port 22 provides encrypted remote shell access and replaced insecure Telnet (port 23).", "difficulty": "Straightforward"}, {"stem": "An IDS alerts on an attack, but the malicious packets still reach the target server. The PRIMARY reason is:", "options": ["The IDS signatures are outdated", "An IDS only detects and alerts; it does not block traffic", "The firewall is misconfigured", "The attack used encryption"], "answer": 1, "explanation": "Unlike an IPS (which sits inline and blocks), an IDS is typically passive — it monitors and alerts but cannot stop the traffic.", "difficulty": "Straightforward"}, {"stem": "A company segments its network so that each individual server has its own firewall policy, drastically limiting an attacker's ability to move laterally after breaching one host. This technique is:", "options": ["VLAN trunking", "Microsegmentation", "NAT", "Subnet masking"], "answer": 1, "explanation": "Microsegmentation creates granular, per-workload security zones — a core Zero Trust practice that contains lateral movement.", "difficulty": "Straightforward"}]}, {"id": 5, "name": "Security Operations", "notes": "# Domain 5: Security Operations — Study Notes\n### ISC2 CC (Certified in Cybersecurity) Exam Prep\n\n> Paraphrased study notes with extra explanations and examples. This domain covers day-to-day security work: data handling, logging, encryption, passwords, change management, and training users.\n\n---\n\n## 1. Data Handling — the Full Lifecycle\n\n**Data handling** = managing data through its entire lifecycle: **creation → storage → use → sharing → archiving → destruction**.\n\nProtections at each stage:\n- **Storage:** encrypt data at rest, apply access controls.\n- **In transit:** use secure protocols (TLS).\n- **Sharing:** only to authorized parties via approved channels; use **DLP** (data loss prevention) against exfiltration.\n- **Retention:** keep data per a **retention schedule** (driven by business needs + legal requirements) — don't hoard forever, don't delete too early.\n- **Destruction:** must be **complete and unrecoverable** — paper **shredded**, drives wiped or physically destroyed, encrypted data destroyed via **crypto-erasure** (destroying the encryption keys).\n\n**Classify and label data first** (public / internal / confidential / restricted) — the classification decides how strictly each stage is handled. Extra care for **PII/PHI**: minimize collection, anonymize where possible, meet GDPR/HIPAA duties.\n\n*Failure at ANY stage = breach risk.* The classic example: an employee downloads a customer database to USB at 2 AM and walks to a competitor — logging + DLP should catch it.\n\n---\n\n## 2. Logging and Monitoring\n\n**Logging** = recording events (who did what, when). **Monitoring** = reviewing those logs to detect security events. Unreviewed logs are useless — review regularly (manually or via SIEM).\n\n**What to log:** authentication attempts, privilege use/escalation, system/config changes, sensitive-data access, network connections.\n\n**Each log entry needs:** synchronized timestamp (**NTP** — clocks must agree or you can't correlate events), user/device identity, action performed, result (success/failure), source/destination.\n\n**Protect the logs themselves:** centralize them (SIEM/syslog server), restrict access, make storage tamper-evident (append-only) — attackers delete logs to hide their tracks.\n\n**Uses:** incident detection, forensic investigation, compliance proof, accountability.\n\n---\n\n## 3. Encryption, Hashing, and Passwords\n\n### Symmetric vs Asymmetric vs Hashing — the big three\n\n| | **Symmetric** | **Asymmetric** | **Hashing** |\n|---|---|---|---|\n| Keys | **One shared secret** key encrypts AND decrypts | **Key pair:** public encrypts, private decrypts (reversed for signatures) | **No key** — one-way function |\n| Speed | **Fast** — best for bulk data | Slow | Fast |\n| Strengths | Efficient for large volumes (disk encryption, backups, TLS bulk cipher) | Solves **key distribution**; enables digital signatures | Integrity verification; password storage |\n| Weaknesses | **Key distribution problem** — both sides must share the secret securely; key count explodes (n(n−1)/2 pairs) | Computationally heavy | **Irreversible** — can't recover original data (that's the point) |\n| In practice | The workhorse, fed by... | ...asymmetric exchange of a temporary **symmetric session key** | Salted + stretched for passwords |\n\n*How they combine in real life (e.g., visiting an HTTPS site):* asymmetric encryption securely swaps a temporary symmetric session key → that session key encrypts all the actual data (fast). Best of both worlds.\n\n### Hashing details\n- A hash = **fixed-size fingerprint** of any input; **deterministic** (same input → same hash), fast, with the **avalanche effect** (tiny input change → totally different hash), and **collision-resistant** (two inputs giving the same hash should be practically impossible).\n- **Secure:** SHA-256, SHA-3. **Broken — never use for security:** MD5, SHA-1.\n- **Salting:** add a unique random value before hashing → defeats **rainbow tables** (precomputed hash dictionaries). **Pepper** = a secret salt. **Key stretching** (bcrypt, PBKDF2, Argon2) = hash repeatedly to slow down brute force.\n- **Hashing ≠ encryption:** hashing is one-way (no decryption possible); encryption reverses with the key.\n\n### Password rules that matter\n- Systems must store **salted hashes, never plaintext**. Transmit passwords only over encrypted channels (TLS).\n- Strong = **long, unique per account** (length matters most) — passphrases of random words work well.\n- **Never reuse** across accounts, **never share**, no sticky notes, **never hardcode** in scripts (use vaults/secrets management).\n- Use a **password manager**; enable **MFA** wherever possible; lock accounts after failed attempts; block known-breached passwords.\n- Weak passwords attackers try first: `123456`, `password`, `qwerty`, birthdays, names.\n\n---\n\n## 4. Phishing — Know the Variants\n\n**Phishing** = fraudulent messages impersonating trusted entities to steal credentials or deliver malware. Channels: email (phishing), SMS (**smishing**), voice calls (**vishing**).\n\n| Variant | Target |\n|---|---|\n| **Spear phishing** | Specific individuals (personalized) |\n| **Whaling** | Senior **executives** (big fish) |\n| **BEC** (Business Email Compromise) | Fake executive/vendor emails tricking staff into payments or data release |\n\n**Red flags:** urgency/threats (\"act now or else\"), unexpected attachments/links, mismatched sender address, generic greetings (\"Dear Customer\"), requests for credentials or money.\n\n**Defenses:** user training, email filtering, MFA (stolen passwords alone aren't enough), **out-of-band verification** (confirm payment requests via a second channel), easy reporting of suspicious messages.\n\n---\n\n## 5. Change Management and Configuration Management\n\n### Change management — the controlled flow (in order)\n1. **Change request** — documented: what, why, when.\n2. **Impact/risk assessment** — what could break? (Often reviewed by a **Change Advisory Board / CAB**.)\n3. **Approval** — by the appropriate authority, scheduled in a maintenance window.\n4. **Testing** — in staging/non-production first.\n5. **Implementation** — controlled, with a **backout/rollback plan** ready (how to revert if it fails — required BEFORE implementing).\n6. **Post-implementation review** — verify it works, update documentation, capture lessons learned.\n\n**Emergency changes** move faster but are still **documented and reviewed afterward**. Skipping steps = more outages — auditors check this process.\n\n*Workplace example:* email server upgrade → request → CAB assesses downtime impact → approved for weekend window → staging test → backout plan ready → implement → verify → document.\n\n### Configuration management\nTracking and controlling system configurations to keep them **secure and consistent**: secure **baseline configurations**, change control, version control, auditing. Prevents **configuration drift** — the gradual deviation from secure baselines that silently creates vulnerabilities. Applies to OS, apps, network devices, cloud resources.\n\n---\n\n## 6. Security Policies — the Hierarchy in Action\n\n**Common policies:** Acceptable Use (AUP), password policy, data classification, remote access/VPN, BYOD, incident response, backup.\n\nRemember the governance chain from Domain 1: **Policy** (management intent — \"all laptops must be encrypted\") → **Standard** (mandatory specifics — \"AES-256\") → **Procedure** (step-by-step — \"how to enable BitLocker\") → **Guideline** (recommended best practices). A policy nobody knows about can't be followed — **communicate and train**.\n\n- **AUP:** permitted/prohibited system uses; personal-use limits; bans illegal/offensive activity.\n- **Password policy:** length, complexity, history, lockout, MFA requirements.\n- **Data classification policy:** labels (public/internal/confidential/restricted) + handling rules per label.\n- **Remote access policy:** who may connect remotely, approved methods (VPN), device requirements.\n- **Exceptions** to policy need **documented approval**.\n\nPolicies must be **reviewed regularly** (at least annually) and after major changes.\n\n---\n\n## 7. Security Awareness Training\n\n**Why:** users are often the **weakest link** — teach them to recognize and avoid threats (phishing, social engineering, malware).\n\n**What works:** frequent, short, relevant sessions (NOT one annual click-through deck); **real recent attack examples**; **simulated phishing** with instant feedback when someone clicks; **role-tailored** content (finance → BEC scams, developers → secure coding, executives → whaling); visible leadership support; easy **blame-free reporting** (early reports limit damage).\n\n**Measure it:** phishing click rates, reporting rates, quiz scores, completion rates — then improve continuously. Repeat clickers get coaching, not punishment.\n\n**Topics:** password hygiene, phishing recognition, safe browsing, data handling, incident reporting, physical security (tailgating, clean desk).\n\n---\n\n## Practice Questions — Domain 5\n\n**Q1.** The correct order of the data lifecycle is:\na) Create → destroy → store → share · **b) Create → store → use → share → archive → destroy** ✓ · c) Store → create → archive → destroy · d) Create → share → destroy → archive\n\n**Q2.** Crypto-erasure means:\na) Encrypting backups · **b) Destroying the encryption keys so encrypted data becomes unrecoverable** ✓ · c) Deleting files normally · d) Shredding paper\n\n**Q3.** Log timestamps must be synchronized (NTP) primarily so that:\na) Logs look neat · **b) Events can be correlated across systems** ✓ · c) Storage is saved · d) Attackers can't read them\n\n**Q4.** Which is a one-way function used for integrity verification that cannot be reversed?\na) Symmetric encryption · b) Asymmetric encryption · **c) Hashing** ✓ · d) Steganography\n\n**Q5.** Salting passwords primarily defeats:\na) Phishing · **b) Rainbow table attacks** ✓ · c) Keyloggers · d) DDoS\n\n**Q6.** MD5 and SHA-1 should not be used for security because they are:\na) Too slow · **b) Broken (collisions demonstrated)** ✓ · c) Too new · d) Patented\n\n**Q7.** In asymmetric encryption, data encrypted with the public key can only be decrypted with:\na) The same public key · **b) The matching private key** ✓ · c) Any private key · d) A symmetric key\n\n**Q8.** A text message pretending to be your bank asking for your OTP is an example of:\na) Whaling · **b) Smishing** ✓ · c) BEC · d) Pharming\n\n**Q9.** An email impersonating the CEO asking finance to urgently wire money to a vendor is:\na) Spear phishing · b) Whaling · **c) Business Email Compromise (BEC)** ✓ · d) Vishing\n\n**Q10.** In change management, the backout/rollback plan must be prepared:\na) After implementation · **b) Before implementing the change** ✓ · c) Only for emergencies · d) Never — it's optional\n\n**Q11.** Configuration drift refers to:\na) Employees changing roles · **b) Gradual deviation from secure baseline configurations** ✓ · c) Network latency · d) Data traveling abroad\n\n**Q12.** \"All laptops must use AES-256 encryption\" is a ______, while \"how to enable BitLocker step by step\" is a ______.\na) Guideline, policy · **b) Standard, procedure** ✓ · c) Procedure, standard · d) Policy, guideline\n\n**Q13.** Effective security awareness training is best described as:\na) One long annual session · **b) Frequent, short, relevant sessions with simulated phishing** ✓ · c) Punishing anyone who clicks · d) Only for IT staff\n\n**Q14.** Why should passwords never be stored in plaintext?\na) It wastes storage · **b) Anyone accessing the database would get all passwords** ✓ · c) Hashing is faster · d) Users forget them\n\n**Q15.** The symmetric session key in an HTTPS connection is exchanged using:\na) Symmetric encryption · **b) Asymmetric encryption** ✓ · c) Hashing · d) Plaintext\n\n### Answers\n1-b, 2-b, 3-b, 4-c, 5-b, 6-b, 7-b, 8-b, 9-c, 10-b, 11-b, 12-b, 13-b, 14-b, 15-b\n\n---\n\n*Saved: 2026-09-19. Source: ISC2 CC Online Self-Paced Training, Domain 5 (paraphrased notes + original practice questions).*\n", "questions": [{"stem": "Customer records stored in a company database are an example of which data state?", "options": ["Data in transit", "Data at rest", "Data in use", "Data in motion"], "answer": 1, "explanation": "Data sitting in storage (disk, database, backup) is \"at rest\"; protection = encryption + access controls.", "difficulty": "Straightforward"}, {"stem": "A product brochure published on the company's public website should be classified as:", "options": ["Restricted", "Public", "Confidential", "Internal"], "answer": 1, "explanation": "Public = anyone may see it; the least restrictive label, used for marketing material and press releases.", "difficulty": "Straightforward"}, {"stem": "Digital signatures provide authenticity, integrity, and non-repudiation. Which security service do they NOT provide?", "options": ["Integrity", "Confidentiality", "Non-repudiation", "Authentication of origin"], "answer": 1, "explanation": "A signature proves who sent data and that it wasn't altered, but the message itself is still readable — confidentiality needs encryption.", "difficulty": "Straightforward"}, {"stem": "In a Public Key Infrastructure (PKI), the PRIMARY role of a Certificate Authority (CA) is to:", "options": ["Generate symmetric session keys for users", "Issue and validate digital certificates that bind public keys to identities", "Store users' private keys", "Encrypt all network traffic"], "answer": 1, "explanation": "The CA is the trusted third party that verifies identity and signs certificates, so others can trust a public key really belongs to its claimed owner.", "difficulty": "Straightforward"}, {"stem": "A system uses ONLY symmetric encryption, and every pair of users needs a unique shared key. With 10 users, how many keys are required?", "options": ["10", "20", "45", "100"], "answer": 2, "explanation": "Keys needed = n(n−1)/2 = 10×9/2 = 45. This \"key explosion\" is the big weakness of symmetric-only encryption and why asymmetric key exchange is used.", "difficulty": "Straightforward"}, {"stem": "Which is the STRONGEST defense against credential-stuffing attacks (attackers trying leaked passwords on other sites)?", "options": ["Requiring users to change passwords every 30 days", "Enforcing complex 8-character passwords", "A unique password per account plus MFA", "Writing passwords in a notebook kept at home"], "answer": 2, "explanation": "Credential stuffing works because people reuse passwords; uniqueness kills the attack, and MFA blocks login even if a password leaks.", "difficulty": "Straightforward"}, {"stem": "A critical security patch must be deployed immediately to stop an active attack. What is the BEST approach?", "options": ["Skip documentation entirely — speed matters more than process", "Implement the change now, then document and review it afterward", "Wait for the next scheduled CAB meeting before acting", "Deploy without testing to save time"], "answer": 1, "explanation": "Emergency changes are allowed to move fast, but they must still be documented and reviewed afterward — \"emergency\" skips the queue, not accountability.", "difficulty": "Straightforward"}, {"stem": "In change management, which body typically reviews high-impact changes for risk before approval?", "options": ["The help desk", "The incident response team", "The Change Advisory Board (CAB)", "The social engineering team"], "answer": 2, "explanation": "The CAB assesses what a proposed change could break and whether the risk is acceptable before it is approved.", "difficulty": "Straightforward"}, {"stem": "A vendor releases a critical patch for a server OS. What should be done FIRST?", "options": ["Deploy it straight to production to close the vulnerability fast", "Uninstall the affected software", "Test the patch in a non-production (staging) environment", "Ignore it until the next maintenance window"], "answer": 2, "explanation": "Even critical patches can break systems; testing in staging first confirms the fix works and nothing else fails.", "difficulty": "Straightforward"}, {"stem": "After a breach, investigators find the attacker deleted all logs on the compromised server. Which practice would have preserved the evidence?", "options": ["Encrypting the logs", "Centralizing logs on a remote SIEM/syslog server", "Shortening the log retention period", "Storing logs in plaintext for easy reading"], "answer": 1, "explanation": "Forwarding logs off the host means attackers can't erase their tracks by wiping local files.", "difficulty": "Straightforward"}, {"stem": "What is the PRIMARY difference between logging and monitoring?", "options": ["Logging is for networks, monitoring is for servers", "Logging records events; monitoring reviews and analyzes them", "Monitoring records events; logging reviews them", "There is no difference — the terms are interchangeable"], "answer": 1, "explanation": "Logs are raw records; monitoring is the active review (manual or SIEM-driven) that turns records into detection.", "difficulty": "Straightforward"}, {"stem": "Which metric BEST shows that phishing awareness training is actually working?", "options": ["Number of training slides completed", "Number of employees in the company", "Falling phishing click rates combined with rising reporting rates", "Length of the annual training session"], "answer": 2, "explanation": "Behavior change is the goal — fewer clicks means people recognize phish, more reports means they act on it.", "difficulty": "Straightforward"}, {"stem": "A caller claiming to be from IT support says your account will be locked unless you give them your password \"to fix an urgent issue.\" What is the BEST response?", "options": ["Give the password — IT needs it to help you", "Refuse, hang up, and report the call to security", "Ask them to call back later", "Give a fake password to waste their time"], "answer": 1, "explanation": "Legitimate IT never asks for your password; this is vishing. Refusing and reporting protects you and warns the organization.", "difficulty": "Straightforward"}, {"stem": "Which email characteristic is the STRONGEST indicator that a message is phishing?", "options": ["It contains the company logo", "The sender's domain does not match the organization it claims to be from", "It is written in proper English", "It arrived during work hours"], "answer": 1, "explanation": "Attackers can fake logos and grammar, but a mismatched domain (e.g., amaz0n-support.com) is the telltale technical sign.", "difficulty": "Straightforward"}, {"stem": "Finance receives an email from the \"CFO\" urgently requesting a wire transfer to a new vendor account. What should finance do FIRST?", "options": ["Wire the money immediately — the CFO outranks everyone", "Reply to the email asking for confirmation", "Verify the request through a second channel, such as calling the CFO on a known number", "Forward the email to the whole company"], "answer": 2, "explanation": "Out-of-band verification defeats BEC: email can be spoofed, but a call to a known number reaches the real person.", "difficulty": "Straightforward"}, {"stem": "Backup tapes containing restricted data are being retired. Which disposal method BEST ensures the data cannot be recovered?", "options": ["Deleting the files from the tapes", "Reformatting the tapes", "Degaussing the tapes", "Storing the tapes in a locked drawer"], "answer": 2, "explanation": "Degaussing destroys data on magnetic media by disrupting the magnetic field, leaving insufficient remanence to reconstruct anything.", "difficulty": "Straightforward"}, {"stem": "Why is simply deleting a file (emptying the recycle bin) inadequate for disposing of sensitive data?", "options": ["It takes too long", "The data remains recoverable on the disk until overwritten", "It violates the retention schedule", "It requires administrator privileges"], "answer": 1, "explanation": "Deletion usually just removes the file-system pointer; recovery tools can restore the actual data — secure disposal needs wiping, destruction, or crypto-erasure.", "difficulty": "Straightforward"}, {"stem": "The PRIMARY purpose of a Data Loss Prevention (DLP) system is to:", "options": ["Back up company data automatically", "Detect and prevent unauthorized transmission of sensitive data", "Encrypt data at rest", "Train users on phishing"], "answer": 1, "explanation": "DLP watches data leaving the organization (email, uploads, USB) and blocks or alerts on policy violations.", "difficulty": "Straightforward"}, {"stem": "An employee needs to access the corporate network from a café's public Wi-Fi. Which is the BEST protection?", "options": ["Disabling the firewall for faster access", "Connecting through the company VPN", "Using the café's open network directly", "Turning off Wi-Fi and using nothing"], "answer": 1, "explanation": "A VPN encrypts the tunnel between the laptop and the corporate network, protecting traffic from eavesdroppers on the shared Wi-Fi.", "difficulty": "Straightforward"}, {"stem": "You download software and compare the publisher's published SHA-256 value against the hash you compute locally. What are you verifying?", "options": ["Confidentiality of the download", "The speed of the download", "Integrity — that the file was not altered or corrupted", "The identity of the publisher"], "answer": 2, "explanation": "Any change to the file (malicious or accidental) produces a completely different hash, so a matching hash proves the file is intact.", "difficulty": "Straightforward"}, {"stem": "The \"avalanche effect\" in hashing means that:", "options": ["Hashes get slower as files get bigger", "A tiny change in the input produces a completely different hash", "Hashing many files at once crashes the system", "Two different inputs always produce the same hash"], "answer": 1, "explanation": "This property is what makes hashes useful for integrity checks — even a one-bit change is instantly detectable.", "difficulty": "Straightforward"}, {"stem": "A developer hardcodes a database password directly in a deployment script. What is the BEST fix?", "options": ["Make the script read-only", "Comment out the password line", "Store the credential in a secrets vault and have the script retrieve it at runtime", "Email the password to the team instead"], "answer": 2, "explanation": "Hardcoded secrets leak through version control, backups, and shared files; a vault keeps them encrypted and access-controlled.", "difficulty": "Straightforward"}, {"stem": "Data actively being processed in a application's memory (RAM) is in which state?", "options": ["Data at rest", "Data in transit", "Data in use", "Data archived"], "answer": 2, "explanation": "\"In use\" = data being processed or held in memory; it is the hardest state to protect because it must be unencrypted to be processed.", "difficulty": "Straightforward"}, {"stem": "You must send an email that is BOTH confidential and non-repudiable (the recipient can't deny it came from you, and nobody else can read it). What should you do?", "options": ["Hash the email with SHA-256", "Encrypt with your own private key", "Sign with your private key, then encrypt with the recipient's public key", "Encrypt with the recipient's private key"], "answer": 2, "explanation": "Your private-key signature proves origin (non-repudiation); encrypting with the recipient's public key means only their private key can read it (confidentiality).", "difficulty": "Straightforward"}, {"stem": "A company hashes passwords with plain SHA-256 and no salt. Two users happen to choose the same password. What will an attacker who steals the database observe?", "options": ["Nothing unusual — the hashes will look different", "Two identical hashes, revealing that the users share the same password", "The passwords in plaintext", "Only one hash, since duplicates are merged"], "answer": 1, "explanation": "Without a unique salt, identical inputs produce identical hashes — attackers learn who shares passwords and can crack all of them at once with rainbow tables.", "difficulty": "Straightforward"}]}], "flashcards": [{"domain": 1, "front": "Adequate Security", "back": "Security commensurate with the risk and the magnitude of harm resulting from the loss, misuse or unauthorized access to or modification of information. (OMB Circular A-130)"}, {"domain": 1, "front": "Administrative Controls", "back": "Controls implemented through policy and procedures (e.g., access control processes, requiring multiple personnel for an operation); often enforced with physical/technical controls."}, {"domain": 1, "front": "Artificial Intelligence", "back": "The ability of computers and robots to simulate human intelligence and behavior."}, {"domain": 1, "front": "Asset", "back": "Anything of value owned by an organization — tangible (systems, property) and intangible (intellectual property)."}, {"domain": 1, "front": "Authentication", "back": "Identifying/verifying eligibility to access information; protects against fraudulent transmissions by establishing validity of a transmission, message, station, or originator."}, {"domain": 1, "front": "Authorization", "back": "The right/permission granted to a system entity to access a system resource. (NIST 800-82 Rev.2)"}, {"domain": 1, "front": "Availability", "back": "Ensuring timely and reliable access to and use of information by authorized users."}, {"domain": 1, "front": "Baseline", "back": "A documented, lowest level of security configuration allowed by a standard or organization."}, {"domain": 1, "front": "Biometric", "back": "Biological characteristics of an individual (fingerprint, hand geometry, voice, iris patterns)."}, {"domain": 1, "front": "Bot", "back": "Malicious code acting like a remotely controlled \"robot\" for an attacker, with Trojan and worm capabilities."}, {"domain": 1, "front": "Classified or Sensitive Information", "back": "Information requiring protection against unauthorized disclosure, marked with its classification level."}, {"domain": 1, "front": "Confidentiality", "back": "Data/information not made available or disclosed to unauthorized persons or processes. (NIST 800-66)"}, {"domain": 1, "front": "Criticality", "back": "How much an organization depends on information/a system for mission or business success. (NIST SP 800-60)"}, {"domain": 1, "front": "Data Integrity", "back": "Data not altered in an unauthorized manner — in storage, processing, and transit. (NIST SP 800-27)"}, {"domain": 1, "front": "Encryption", "back": "Converting plaintext to ciphertext (also called enciphering)."}, {"domain": 1, "front": "General Data Protection Regulation (GDPR)", "back": "In 2016 the EU passed comprehensive legislation addressing personal privacy as an individual human right."}, {"domain": 1, "front": "Governance", "back": "How an organization is managed — policies, roles, and procedures used to make decisions."}, {"domain": 1, "front": "HIPAA", "back": "The most important US healthcare information regulation; national standards for electronic healthcare transactions + privacy of health info. Est. 1996."}, {"domain": 1, "front": "Impact", "back": "Magnitude of harm from a threat exploiting a vulnerability."}, {"domain": 1, "front": "Information Security Risk", "back": "Potential adverse impacts on operations, assets, individuals, other orgs, even the nation, from unauthorized access/use/disclosure/disruption/modification/destruction of information systems."}, {"domain": 1, "front": "Integrity", "back": "Information recorded, used, and maintained to ensure completeness, accuracy, consistency, and usefulness."}, {"domain": 1, "front": "International Organization for Standardization (ISO)", "back": "Develops voluntary international standards with IEC and ITU, esp. in ICT."}, {"domain": 1, "front": "Internet Engineering Task Force (IETF)", "back": "Internet standards organization defining protocol standards (IP, TCP, DNS) by collaboration and consensus."}, {"domain": 1, "front": "Likelihood", "back": "Probability a vulnerability may be exploited given the threat environment."}, {"domain": 1, "front": "Likelihood of Occurrence", "back": "Weighted factor from subjective analysis of the probability a threat can exploit vulnerabilities."}, {"domain": 1, "front": "Multi-Factor Authentication", "back": "Two or more distinct instances of the three authentication factors for identity verification."}, {"domain": 1, "front": "National Institute of Standards and Technology (NIST)", "back": "US Dept. of Commerce agency; sets standards including information security (CSRC)."}, {"domain": 1, "front": "Non-repudiation", "back": "Inability to deny an action (creating/approving/sending/receiving information)."}, {"domain": 1, "front": "Personally Identifiable Informat
