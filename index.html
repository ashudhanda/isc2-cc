th or interact with a system, use system resources, gain knowledge of the information it contains, or control system components and functions."}, {"term": "Access Control", "definition": "Granting or denying requests to (1) obtain/use information and related services, and (2) enter physical facilities."}, {"term": "Access Control List (ACL)", "definition": "A table telling the OS which access rights each user has to an object (file/directory); typical rights: read, write, execute."}, {"term": "Administrative Controls", "definition": "Management actions, policies and procedures protecting assets. Also called \"soft controls.\""}, {"term": "Anonymization", "definition": "Removing any association between an individual and their stored data."}, {"term": "Asymmetric Encryption", "definition": "Two different keys encrypt and decrypt (public key encrypts, private key decrypts)."}, {"term": "Attack", "definition": "Attempt to gain unauthorized access or compromise integrity, availability, or confidentiality."}, {"term": "Attack Vector", "definition": "The path/means by which an attacker gains access to deliver a malicious outcome (e.g., phishing email, unpatched service)."}, {"term": "Authentication", "definition": "Verifying identity — something you know, have, or are."}, {"term": "Authorization", "definition": "Granting permissions to perform an action or access data."}, {"term": "Availability", "definition": "Being accessible and usable on demand by an authorized entity."}, {"term": "Baseline", "definition": "Initial observations/data for comparison, or initial secure settings for hardware/software."}, {"term": "Biometrics", "definition": "Physical/behavioral characteristics verifying identity (fingerprints, face, voice) — \"something you are.\""}, {"term": "Bot", "definition": "A compromised computer remotely controlled to perform malicious tasks. Also called a Zombie."}, {"term": "Breach", "definition": "An incident resulting in disclosure or potential exposure of data."}, {"term": "BYOD (Bring Your Own Device)", "definition": "Using a personal device to access organizational data."}, {"term": "Business Continuity (BC)", "definition": "Actions/processes/tools ensuring the organization keeps operating during disruption."}, {"term": "Business Continuity Plan (BCP)", "definition": "Documented procedures for sustaining mission/business processes during and after disruption."}, {"term": "Business Impact Analysis (BIA)", "definition": "Analysis of system requirements, functions, and interdependencies to set contingency priorities."}, {"term": "Change Management", "definition": "Formal process ensuring changes are introduced in a controlled, coordinated manner."}, {"term": "Ciphertext", "definition": "The scrambled, unintelligible version of a message produced with a key."}, {"term": "Cloud Computing", "definition": "Using remote internet-hosted servers to store, manage, and process data."}, {"term": "Confidentiality", "definition": "Data not made available/disclosed to unauthorized persons or processes."}, {"term": "Configuration Management", "definition": "Establishing and maintaining integrity of IT products/systems through control of configuration processes."}, {"term": "Control", "definition": "A safeguard/countermeasure reducing likelihood or impact of a risk to an acceptable level. Also called Countermeasure."}, {"term": "Cryptography", "definition": "Techniques for secure communication in the presence of adversaries."}, {"term": "Cybersecurity", "definition": "Protecting information systems and their data from damage, unauthorized use/modification, or exploitation."}, {"term": "Data Classification", "definition": "Classifying data by sensitivity/criticality/value, or impact if compromised."}, {"term": "Data Controller", "definition": "Determines purposes and manner of personal-data processing."}, {"term": "Data Custodian", "definition": "Protects data and controls access (often sysadmin/IT staff)."}, {"term": "Data Owner", "definition": "Decides data classification, value, use; ensures protection."}, {"term": "Data Processor", "definition": "Processes personal data on behalf of the controller."}, {"term": "Data Retention", "definition": "Policies for keeping data a specified time (often legal/regulatory)."}, {"term": "Data Subject", "definition": "The individual whom personal data relates to."}, {"term": "Decryption", "definition": "Converting ciphertext back to plaintext with algorithm + key."}, {"term": "Defense in Depth", "definition": "Integrating people, technology, and operations to build variable barriers across multiple layers."}, {"term": "DMZ (Demilitarized Zone)", "definition": "Network area between two networks (e.g., LAN and Internet), firewall-protected, hosting public-facing servers."}, {"term": "Denial of Service (DoS)", "definition": "Attack preventing/impairing authorized use of resources. **DDoS** uses numerous hosts."}, {"term": "Deterrent Controls", "definition": "Controls intended to discourage potential attackers."}, {"term": "Digital Forensics", "definition": "Scientific identification, collection, examination, analysis of data with preserved integrity and chain of custody."}, {"term": "Digital Signature", "definition": "Cryptographic transformation verifying origin, integrity, and non-repudiation."}, {"term": "Disaster Recovery (DR)", "definition": "Activities returning information systems to operational state."}, {"term": "Disaster Recovery Plan (DRP)", "definition": "Written plan for recovering systems at an alternate facility after major failure."}, {"term": "DNS", "definition": "Converts alphabetic names to numeric IP addresses."}, {"term": "Due Care", "definition": "The care a prudent, competent professional would exercise (based on industry best practices)."}, {"term": "Due Diligence", "definition": "Identifying/understanding risks and planning mitigation."}, {"term": "DHCP", "definition": "Dynamically allocates IP addresses on a LAN."}, {"term": "Eavesdropping", "definition": "Unauthorized listening to/interception of communications."}, {"term": "Encryption", "definition": "Converting plaintext to ciphertext with algorithm + key."}, {"term": "Event", "definition": "Any observable occurrence in a network/system."}, {"term": "Firewall", "definition": "Gateway limiting access between networks per security policy."}, {"term": "GDPR", "definition": "EU regulation on data protection/privacy for individuals in the EU."}, {"term": "Governance", "definition": "Board/executive responsibilities: strategic direction, objectives, risk management, responsible resource use."}, {"term": "Guideline", "definition": "Non-mandatory recommendation on achieving a desired outcome."}, {"term": "Hash Function", "definition": "One-way algorithm mapping arbitrary data to fixed-size output; practically infeasible to invert."}, {"term": "HIPAA", "definition": "US law protecting patients' medical records/health information privacy."}, {"term": "Honeypot", "definition": "Decoy system/resource attractive to attackers, with no legitimate users."}, {"term": "Hot Site", "definition": "Fully operational off-site facility ready for use during disruption."}, {"term": "HTTPS", "definition": "HTTP over secure (encrypted) communication."}, {"term": "Identification", "definition": "Identifying an individual (user ID etc.) for system access."}, {"term": "Impact", "definition": "Magnitude of harm from a threat exploiting a vulnerability."}, {"term": "Incident", "definition": "Occurrence jeopardizing CIA or violating security policies (intentional or unintentional)."}, {"term": "Incident Response", "definition": "Actions to identify, contain, eradicate, recover from an incident + lessons learned."}, {"term": "Incident Response Plan (IRP)", "definition": "Predetermined procedures to detect, respond to, and limit consequences of cyber attacks."}, {"term": "Information Security", "definition": "Protecting information/systems from unauthorized access, use, disclosure, disruption, modification, destruction — providing CIA."}, {"term": "Integrity", "definition": "Property of accuracy and completeness."}, {"term": "Intrusion", "definition": "Unauthorized access (or attempt) to a system/network."}, {"term": "IDS", "definition": "Software automating intrusion detection. **IPS** — IDS plus the ability to stop incidents."}, {"term": "IPSec", "definition": "Protocol suite securing IP communications via authentication + encryption per packet."}, {"term": "Key", "definition": "Secret value used to encrypt/decrypt or sign/verify."}, {"term": "Keylogger", "definition": "Surveillance tech recording keystrokes."}, {"term": "Key Management", "definition": "Generating, distributing, storing, using, destroying cryptographic keys."}, {"term": "Least Privilege", "definition": "Users get only minimum access needed for their job."}, {"term": "LAN", "definition": "Network interconnecting computers in a limited area."}, {"term": "Log", "definition": "Record of events in systems/networks."}, {"term": "Logic Bomb", "definition": "Malicious code triggering when specified conditions are met."}, {"term": "Malware", "definition": "Software intended to damage/disable computers."}, {"term": "Mandatory Access Control (MAC)", "definition": "Access based on sensitivity labels vs user clearances."}, {"term": "Mantrap", "definition": "Small room with interlocking entry/exit doors; isolates individuals during ID check; prevents tailgating."}, {"term": "MTD (Maximum Tolerable Downtime)", "definition": "Longest a process can be disrupted without unacceptable consequences. Also MAD/MTPD/MTO."}, {"term": "Microsegmentation", "definition": "Fine-grained policies down to workload/VM level."}, {"term": "Mitigation", "definition": "Measures reducing likelihood and/or consequences of unwanted events."}, {"term": "Monitoring", "definition": "Continually checking/reviewing systems to spot incidents/vulnerabilities."}, {"term": "MFA", "definition": "Authentication with 2+ factors (know/have/are)."}, {"term": "Mutual Authentication", "definition": "Both parties authenticate each other."}, {"term": "NIST", "definition": "US agency developing measurement, standards, technology."}, {"term": "NAC", "definition": "Unifies endpoint security, authentication, and network enforcement."}, {"term": "NAT", "definition": "Remaps IP address space in transit across a routing device."}, {"term": "Non-repudiation", "definition": "Proof of delivery + sender identity, so neither can deny processing the information."}, {"term": "OSI Model", "definition": "7-layer conceptual model standardizing network communication."}, {"term": "Password", "definition": "Character string authenticating identity/verifying authorization."}, {"term": "Patch", "definition": "Software update fixing/improving a program (incl. vulnerabilities)."}, {"term": "PCI DSS", "definition": "Security standards for companies handling credit-card information."}, {"term": "Penetration Testing", "definition": "Authorized attempts to defeat system security features."}, {"term": "PII", "definition": "Info distinguishing/tracing an individual's identity (name, SSN, biometrics, etc.)."}, {"term": "Phishing", "definition": "Fraudulent solicitation (email/site) masquerading as legitimate to acquire sensitive data."}, {"term": "Physical Controls", "definition": "Tangible protections: locks, fences, guards."}, {"term": "Plaintext", "definition": "Original unencrypted message/data."}, {"term": "Policy", "definition": "High-level statement of management intent guiding decisions/actions."}, {"term": "Port", "definition": "Communication endpoint identified by port number. **Port Scanning** — Probing ports to find open ones."}, {"term": "Private Key", "definition": "Secret cryptographic key (decrypts/signs). **Public Key** — Shared openly (encrypts/verifies)."}, {"term": "PKI", "definition": "Hardware, software, people, policies, procedures managing digital certificates and public-key encryption."}, {"term": "Privilege Creep", "definition": "Gradual accumulation of access rights beyond job needs."}, {"term": "Qualitative Risk Assessment", "definition": "Non-numerical categories (low/medium/high). **Quantitative** — Numerical values, probability × impact calculations."}, {"term": "Ransomware", "definition": "Malware encrypting files, demanding payment for the key."}, {"term": "RPO", "definition": "Point in time to recover data to; max tolerable data loss."}, {"term": "RTO", "definition": "Targeted time within which a process must be restored."}, {"term": "Redundancy", "definition": "Duplicating critical components for reliability/failover."}, {"term": "Risk", "definition": "Impact on operations/assets/individuals from a threat exploiting vulnerability, given likelihood."}, {"term": "Risk Assessment", "definition": "Identifying, estimating, prioritizing risks."}, {"term": "Risk Avoidance", "definition": "Not engaging in the risky activity. **Mitigation** — Reducing likelihood/impact. **Transference** — Shifting risk (insurance/outsourcing)."}, {"term": "Risk Tolerance", "definition": "Level of risk the organization will accept."}, {"term": "Rootkit", "definition": "Malware gaining undetected admin-level control."}, {"term": "Salt", "definition": "Random data added before hashing; defeats dictionary/rainbow-table attacks."}, {"term": "Security Awareness Training", "definition": "Educating employees on threats and protection."}, {"term": "Security Control", "definition": "Safeguard protecting CIA per defined requirements."}, {"term": "SOC", "definition": "Centralized unit handling security issues."}, {"term": "Segmentation", "definition": "Dividing a network into smaller segments for performance/security/manageability."}, {"term": "SLA", "definition": "Contract specifying expected service levels + performance metrics."}, {"term": "Session Hijacking", "definition": "Attacker takes over a user's session (stolen token/cookie)."}, {"term": "SSO", "definition": "One login accessing multiple applications."}, {"term": "Social Engineering", "definition": "Psychologically manipulating people into actions or divulging info."}, {"term": "Spear Phishing", "definition": "Targeted phishing at specific individuals/orgs."}, {"term": "Spoofing", "definition": "Disguising communication as from a trusted source."}, {"term": "Spyware", "definition": "Secretly installed software gathering user info."}, {"term": "Standard", "definition": "Mandatory requirement for a desired outcome."}, {"term": "SQL Injection", "definition": "Malicious SQL inserted into app inputs to manipulate the database."}, {"term": "Switch", "definition": "Forwards packets between devices within a network."}, {"term": "Symmetric Encryption", "definition": "Same key encrypts and decrypts."}, {"term": "System Hardening", "definition": "Reducing vulnerability surface (removing unneeded software/services)."}, {"term": "Technical Controls", "definition": "Safeguards implemented via hardware/software/firmware."}, {"term": "Threat", "definition": "Circumstance/event potentially harming operations via unauthorized access, destruction, disclosure, modification, or DoS."}, {"term": "Threat Actor", "definition": "Individual/group exploiting vulnerabilities."}, {"term": "Threat Vector", "definition": "Means by which a threat actor carries out objectives."}, {"term": "Token", "definition": "Physical object possessed by a user to authenticate identity."}, {"term": "TCP/IP Model", "definition": "4 layers: Link, Internet, Transport, Application."}, {"term": "Turnstile", "definition": "One-way barrier allowing one person at a time."}, {"term": "User Provisioning", "definition": "Creating, maintaining, deactivating user identities."}, {"term": "VLAN", "definition": "Logical group appearing as one LAN despite geography."}, {"term": "VPN", "definition": "Secure communications mechanism over existing networks."}, {"term": "Vulnerability", "definition": "Weakness exploitable by a threat source."}, {"term": "Whaling Attack", "definition": "Phishing tricking high-placed officials into authorizing large wire transfers."}, {"term": "Zero Day", "definition": "Previously unknown vulnerability, exploitable before detection/prevention exists."}, {"term": "Zero Trust", "definition": "No trusted network space; security managed at every level; microsegmentation as a tool."}], "case_study": [{"n": 1, "title": "Keith's Story", "concept": "Why cybersecurity matters", "body": "Keith (bored, between college semesters) wonders what meaningful work looks like. Sets up the theme: cybersecurity = protecting people's data — work with purpose."}, {"n": 2, "title": "Susan's Morning Cup", "concept": "What cybersecurity professionals actually do", "body": "Susan (security professional) explains her job with everyday analogies:\n- **Fire inspector** → checking infrastructure against standards (compliance/auditing)\n- **Paramedic** → assessing and treating damage after an incident (incident response)\n- **Detective** → tracking down what happened so it doesn't recur (root-cause analysis)\n- **Fortune teller** → predicting future threats (risk assessment/threat intelligence)\n- Key myth busted: **you don't need to be a coder** to work in cybersecurity."}, {"n": 3, "title": "Risk Management: Susan's Good News", "concept": "Qualitative risk assessment + risk matrix", "body": "Newly promoted SOC manager Susan assesses **staffing risk** (analyst turnover → fewer trained triage staff → higher cyber risk):\n- Chooses **qualitative** over quantitative assessment (ranks probability/impact as high/moderate/low — she lacks the data for numbers).\n- Uses a **risk matrix** (likelihood × impact quadrants) to communicate the risk.\n- Recommends one of the four treatments: **mitigate, avoid, transfer, or accept**."}, {"n": 4, "title": "When Lightning Strikes", "concept": "Disaster recovery in action", "body": "A power surge kills the shop's computer. Saved by their **disaster recovery plan**: nightly backups to an external hard drive taken home daily → buy a new computer, restore from backup. Lesson: **backups + a plan = survival**; also add a surge protector (preventive control)."}, {"n": 5, "title": "Incident Response in Action", "concept": "IR plan basics", "body": "After hearing about neighbors' incidents (water-damaged register, stolen laptop with banking data), Keith writes an **incident response plan**: determine damage scope → check for leaked confidential info → recovery procedures → restore. Plus: an employee **contact checklist** and **training** so everyone knows how to communicate during an incident. (Goal of IR: reduce impact.)"}, {"n": 6, "title": "Principle of Least Privilege", "concept": "RBAC in real life", "body": "New hire Gabriella can't fix her own submitted time card — only managers (Nate) can access payroll. Her access is **limited by her role**: she can do exactly what her job needs, nothing more. (Prevents employees giving themselves raises or seeing confidential data.)"}, {"n": 7, "title": "How Users Are Provisioned", "concept": "Account disable vs delete", "body": "Employee Demetra takes a sabbatical → security admin **disables** (not deletes) her account per policy: reduces risk of misuse while she's away, and it's **easy to reactivate** on return. (Matches the course's \"disable before deletion\" practice — preserves audit trails.)"}, {"n": 8, "title": "A Viral Threat", "concept": "Malware via phishing link", "body": "Gabriella clicks a \"gift certificate\" email link → iPad freezes (virus). Lessons: **phishing delivers malware**; verify before clicking; **backups** (she had cloud backup) save you."}, {"n": 9, "title": "Keith Writes a Password Policy", "concept": "Password policy components", "body": "Password expiry (12 weeks), complexity rules (8+ chars, upper/lowercase, number, special character), applies to **everyone including the owner** (privileged accounts are higher-value targets). (Note: \"Keith1234\" as an example is weak — predictable + short.)"}, {"n": 10, "title": "The One That Got Away", "concept": "Security awareness training works", "body": "Gabriella spots a fake \"Amazon\" (misspelled \"Amazom\") $1000-prize text and doesn't respond — then learns Susan **sent it as a simulated phish**. Proof that **awareness training + phishing simulations** change behavior. Closes with the field's appeal: curiosity, communication, teamwork, and analytical thinking matter more than pure coding skill.\n\n---"}]}</script>
<script>
/*
 * CC Study Website — app logic (single self-contained file).
 * DATA is parsed from the embedded #study-data JSON block above (domains,
 * flashcards, glossary, case-study story). This script wires up the view
 * router, dashboard, domain notes/quiz, flashcards, glossary search and the
 * case-study timeline. No dependencies, no build step and no network calls at
 * runtime — everything renders locally in the browser.
 */
const DATA=JSON.parse(document.getElementById('study-data').textContent);
const themeIcons={sun:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"/></svg>',moon:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>'};
function setTheme(theme){document.documentElement.dataset.theme=theme;const dark=theme==='dark';themeToggle.innerHTML=`${themeIcons[dark?'sun':'moon']}<span>${dark?'Light':'Dark'}</span>`;themeToggle.setAttribute('aria-label',`Switch to ${dark?'light':'dark'} mode`);themeToggle.setAttribute('aria-pressed',String(dark))}
const systemTheme=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';setTheme(systemTheme);themeToggle.addEventListener('click',()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark'));
const icons={home:'<svg viewBox="0 0 24 24"><path d="m3 11 9-8 9 8v9a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>',cards:'<svg viewBox="0 0 24 24"><rect x="4" y="3" width="14" height="16" rx="2"/><path d="m8 7 6 0M8 11h4M8 21h10a2 2 0 0 0 2-2V7"/></svg>',quiz:'<svg viewBox="0 0 24 24"><path d="M8.5 8a3.5 3.5 0 1 1 5.3 3c-1.2.7-1.8 1.2-1.8 3"/><path d="M12 18h.01"/><circle cx="12" cy="12" r="10"/></svg>',terms:'<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4M8 11h6M11 8v6"/></svg>',story:'<svg viewBox="0 0 24 24"><path d="M4 5a3 3 0 0 1 3-3h13v17H7a3 3 0 0 0-3 3z"/><path d="M4 5v17M8 7h8M8 11h6"/></svg>'};
const nav=[['dashboard','Home','home'],['flashcards','Cards','cards'],['quiz','Quiz','quiz'],['glossary','Terms','terms'],['case','Story','story']];
let state={view:'dashboard',domain:1,domainTab:'notes',cardsFilter:0,cardOrder:[],cardIndex:0,flipped:false,quizQuestions:[],quizDomain:null,qIndex:0,qAnswers:[],answered:0,studied:new Set(),sessionQuestions:0};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Inline markdown subset: `code`, **bold**, *italic*. Runs after HTML-escaping.
function inline(s){return esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>')}
/* Tiny markdown renderer for domain notes and quiz explanations.
 * Supports #/##/### headings, -/* bulleted lists, 1. numbered lists,
 * > blockquotes, | tables and inline() formatting. Any other line
 * becomes a plain <p>. */
function md(text){const lines=String(text).replace(/\r/g,'').split('\n');let h='',i=0,inList=false,listType='';const close=()=>{if(inList){h+=`</${listType}>`;inList=false}};while(i<lines.length){let l=lines[i];if(/^\s*\|/.test(l)&&i+1<lines.length&&/^\s*\|?\s*:?-+/.test(lines[i+1])){close();let rows=[];rows.push(l);i+=2;while(i<lines.length&&/^\s*\|/.test(lines[i]))rows.push(lines[i++]);const cells=x=>x.trim().replace(/^\||\|$/g,'').split('|').map(v=>inline(v.trim()));h+='<div class="table-wrap"><table><thead><tr>'+cells(rows[0]).map(x=>`<th>${x}</th>`).join('')+'</tr></thead><tbody>'+rows.slice(1).map(r=>'<tr>'+cells(r).map(x=>`<td>${x}</td>`).join('')+'</tr>').join('')+'</tbody></table></div>';continue}let m;if(m=l.match(/^(#{1,3})\s+(.+)/)){close();let n=m[1].length,txt=m[2].replace(/\s+—.*/,'');let id='h-'+i;h+=`<h${n} id="${id}">${inline(txt)}</h${n}>`;i++;continue}if(/^>\s?/.test(l)){close();h+=`<blockquote>${inline(l.replace(/^>\s?/,''))}</blockquote>`;i++;continue}if((m=l.match(/^\s*[-*]\s+(.+)/))){if(!inList||listType!=='ul'){close();h+='<ul>';inList=true;listType='ul'}h+=`<li>${inline(m[1])}</li>`;i++;continue}if((m=l.match(/^\s*\d+[.)]\s+(.+)/))){if(!inList||listType!=='ol'){close();h+='<ol>';inList=true;listType='ol'}h+=`<li>${inline(m[1])}</li>`;i++;continue}close();if(l.trim())h+=`<p>${inline(l)}</p>`;i++}close();return h}
function magnet(el){el.addEventListener('pointermove',e=>{const r=el.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2;el.style.transform=`translate(${x*.12}px,${y*.12}px)`});el.addEventListener('pointerleave',()=>el.style.transform='')}
function addEffects(root=document){root.querySelectorAll('.spotlight').forEach(el=>el.addEventListener('pointermove',e=>{let r=el.getBoundingClientRect();el.style.setProperty('--mx',e.clientX-r.left+'px');el.style.setProperty('--my',e.clientY-r.top+'px')}));root.querySelectorAll('.magnetic').forEach(magnet);root.querySelectorAll('.reveal').forEach(el=>revealObs.observe(el))}
const revealObs=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('seen');revealObs.unobserve(e.target)}}),{threshold:.01,rootMargin:'0px 0px 180px 0px'});
function renderNav(){sideNav.innerHTML=nav.map(([id,label,ic])=>`<button class="nav-btn ${state.view===id?'active':''}" data-go="${id}">${icons[ic]}<span>${label}</span></button>`).join('');bottomNav.innerHTML=nav.map(([id,label,ic])=>`<button class="bottom-btn ${state.view===id?'active':''}" data-go="${id}">${icons[ic]}<span>${label}</span></button>`).join('');document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>show(b.dataset.go))}
function show(id){state.view=id;document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===id));renderNav();if(id==='dashboard')renderDashboard();if(id==='flashcards')renderFlashcards();if(id==='quiz')renderQuizPicker();if(id==='glossary')renderGlossary();if(id==='case')renderCase();window.scrollTo({top:0,behavior:'smooth'})}
function updateSession(){railMeta.textContent=`${state.studied.size} cards · ${state.sessionQuestions} questions`;let total=DATA.flashcards.length+125,pct=((state.studied.size+state.sessionQuestions)/total)*100;railBar.style.width=Math.min(100,pct)+'%';railProgress.textContent=(state.studied.size||state.sessionQuestions)?'Session in progress':'Start a study session';sessionText.textContent=(state.studied.size||state.sessionQuestions)?`${state.studied.size} cards studied · ${state.sessionQuestions} answered`:'Session ready'}
const colors=['#36d5eb','#4da3ff','#a78bfa','#ff8e67','#45d39e'];const domainIcons=['<svg viewBox="0 0 24 24"><path d="m12 2 8 4v6c0 5-3.4 8.8-8 10-4.6-1.2-8-5-8-10V6z"/><path d="m9 12 2 2 4-4"/></svg>','<svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg>','<svg viewBox="0 0 24 24"><rect x="3" y="10" width="18" height="11" rx="2"/><path d="M7 10V7a5 5 0 0 1 10 0v3M12 14v3"/></svg>','<svg viewBox="0 0 24 24"><circle cx="6" cy="12" r="3"/><circle cx="18" cy="6" r="3"/><circle cx="18" cy="18" r="3"/><path d="m8.7 10.6 6.6-3.2M8.7 13.4l6.6 3.2"/></svg>','<svg viewBox="0 0 24 24"><path d="M12 3 4 7v5c0 4.6 3.2 8 8 9 4.8-1 8-4.4 8-9V7z"/><path d="M9 12h6M12 9v6"/></svg>'];
function domainCard(d,i){let fc=DATA.flashcards.filter(x=>x.domain===d.id).length;return `<article class="domain-card spotlight reveal" style="--domain:${colors[i]}" data-domain="${d.id}"><div class="domain-top"><span class="domain-num">DOMAIN 0${d.id}</span><span class="icon-box">${domainIcons[i]}</span></div><h3>${esc(d.name)}</h3><p>${domainDesc[d.id]}</p><div class="domain-meta"><span><b>25</b> questions</span><span><b>${fc}</b> cards</span></div></article>`}
const domainDesc={1:'Risk, controls, governance and the CIA triad.',2:'Response, continuity and recovery under pressure.',3:'Identity, permissions and layered protection.',4:'Protocols, threats, cloud and secure design.',5:'Data handling, monitoring and daily defense.'};
function renderDashboard(){let title='Master the CC exam. One sharp session at a time.';dashboard.innerHTML=`<div class="hero"><div class="eyebrow">ISC2 Certified in Cybersecurity</div><h1>${title.split(' ').map((w,i)=>`<span class="split-word" style="--i:${i}">${w}&nbsp;</span>`).join('')}</h1><p class="hero-copy">Turn the complete course into focused notes, active recall, and realistic practice — across all five exam domains.</p><div class="hero-actions"><button class="btn primary magnetic" id="startCards">Start flashcards →</button><button class="btn secondary magnetic" id="practiceQuiz">Practice questions</button></div></div><div class="stats reveal"><div class="stat"><b data-count="5">0</b><span>exam domains</span></div><div class="stat"><b data-count="125">0</b><span>practice questions</span></div><div class="stat"><b data-count="173">0</b><span>flashcards</span></div><div class="stat"><b data-count="144">0</b><span>glossary terms</span></div></div><div class="section-head reveal"><div><h2>Choose a domain</h2><p>Study the notes, then test the idea.</p></div></div><div class="domain-grid">${DATA.domains.map(domainCard).join('')}</div><div class="section-head reveal"><div><h2>Quick study</h2><p>Jump straight into a focused mode.</p></div></div><div class="quick-grid reveal"><button class="quick" data-quick="flashcards">${icons.cards}<strong>Flashcards</strong><span>Active recall</span></button><button class="quick" data-quick="quiz">${icons.quiz}<strong>Quiz</strong><span>125 questions</span></button><button class="quick" data-quick="glossary">${icons.terms}<strong>Glossary</strong><span>Instant search</span></button><button class="quick" data-quick="case">${icons.story}<strong>JavaSip</strong><span>10-part story</span></button></div>`;dashboard.querySelectorAll('[data-domain]').forEach(c=>c.onclick=()=>openDomain(+c.dataset.domain));dashboard.querySelectorAll('[data-quick]').forEach(b=>b.onclick=()=>show(b.dataset.quick));startCards.onclick=()=>show('flashcards');practiceQuiz.onclick=()=>show('quiz');addEffects(dashboard);animateCounts()}
function animateCounts(){document.querySelectorAll('[data-count]').forEach(el=>{let n=+el.dataset.count,start=performance.now(),dur=900;function t(now){let p=Math.min(1,(now-start)/dur),e=1-Math.pow(1-p,3);el.textContent=Math.round(n*e);if(p<1)requestAnimationFrame(t)}requestAnimationFrame(t)})}
function openDomain(id,tab='notes'){state.domain=id;state.domainTab=tab;state.view='domain';document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id==='domain'));renderNav();renderDomain();window.scrollTo(0,0)}
function renderDomain(){let d=DATA.domains.find(x=>x.id===state.domain);domain.innerHTML=`<button class="back-link" id="backHome">← All domains</button><div class="page-head"><div><p>Domain 0${d.id}</p><h1>${esc(d.name)}</h1></div><div class="tabs"><button class="tab ${state.domainTab==='notes'?'active':''}" data-tab="notes">Notes</button><button class="tab ${state.domainTab==='quiz'?'active':''}" data-tab="quiz">Quiz · 25</button></div></div><div id="domainBody"></div>`;backHome.onclick=()=>show('dashboard');domain.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.domainTab=b.dataset.tab;if(state.domainTab==='quiz')startQuiz(d.id);else renderDomain()});if(state.domainTab==='notes'){let rendered=md(d.notes);domainBody.innerHTML=`<div class="notes-layout"><article class="notes">${rendered}</article><aside class="toc"><b>On this page</b>${[...new DOMParser().parseFromString(rendered,'text/html').querySelectorAll('h2')].slice(0,9).map(h=>`<a href="#${h.id}">${h.textContent}</a>`).join('')}</aside></div>`}addEffects(domain)}
function renderQuizPicker(){quiz.innerHTML=`<div class="page-head"><div><p>Practice mode</p><h1>Choose a quiz</h1><p>25 exam-style questions per domain, with instant explanations.</p></div></div><div class="quiz-picker">${DATA.domains.map((d,i)=>`<button class="picker spotlight" style="--domain:${colors[i]}" data-start="${d.id}"><span class="domain-num">DOMAIN 0${d.id}</span><h3>${esc(d.name)}</h3><small>25 questions · mixed difficulty</small></button>`).join('')}</div>`;quiz.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>startQuiz(+b.dataset.start));addEffects(quiz)}
function startQuiz(domainId,shuffle=false){let d=DATA.domains.find(x=>x.id===domainId);state.quizDomain=domainId;state.quizQuestions=d.questions.map((q,i)=>({...q,_i:i}));if(shuffle)state.quizQuestions.sort(()=>Math.random()-.5);state.qIndex=0;state.qAnswers=[];state.answered=0;state.view='quiz';document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id==='quiz'));renderNav();renderQuestion();window.scrollTo(0,0)}
function renderQuestion(){let qs=state.quizQuestions,d=DATA.domains.find(x=>x.id===state.quizDomain);if(state.qIndex>=qs.length){renderResult();return}let q=qs[state.qIndex];quiz.innerHTML=`<button class="back-link" id="exitQuiz">← Exit quiz</button><div class="quiz-shell"><div class="quiz-top"><span>${esc(d.name)}</span><b>Question ${state.qIndex+1} / ${qs.length}</b></div><div class="progress"><span style="width:${state.qIndex/qs.length*100}%"></span></div><article class="question-card"><span class="difficulty">${esc(q.difficulty||'Practice')}</span><h2>${esc(q.stem)}</h2><div class="options">${q.options.map((o,i)=>`<button class="option" data-opt="${i}"><span class="letter">${'ABCD'[i]}</span><span>${esc(o)}</span></button>`).join('')}</div><div class="explanation" id="explain"><b id="feedbackTitle"></b><span>${esc(q.explanation)}</span></div><div class="quiz-actions"><button class="btn primary" id="nextQ" hidden>${state.qIndex===qs.length-1?'See results':'Next question →'}</button></div></article></div>`;exitQuiz.onclick=()=>renderQuizPicker();quiz.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>answerQuestion(+b.dataset.opt));nextQ.onclick=()=>{state.qIndex++;renderQuestion();window.scrollTo({top:0,behavior:'smooth'})}}
function answerQuestion(choice){if(state.qAnswers[state.qIndex]!=null)return;let q=state.quizQuestions[state.qIndex],correct=choice===q.answer;state.qAnswers[state.qIndex]={choice,correct,difficulty:q.difficulty||'Practice'};state.answered++;state.sessionQuestions++;updateSession();quiz.querySelectorAll('[data-opt]').forEach((b,i)=>{b.disabled=true;if(i===q.answer)b.classList.add('correct');else if(i===choice)b.classList.add('wrong')});feedbackTitle.textContent=correct?'Correct — lock it in.':'Not quite — here’s the rule.';explain.classList.add('show');nextQ.hidden=false}
function renderResult(){let correct=state.qAnswers.filter(a=>a&&a.correct).length,total=state.quizQuestions.length,pct=Math.round(correct/total*100),group={};state.qAnswers.forEach(a=>{let k=a.difficulty||'Practice';group[k]??={c:0,t:0};group[k].t++;if(a.correct)group[k].c++});quiz.innerHTML=`<div class="quiz-shell"><article class="question-card result"><div class="score-ring" style="--score:${pct}"><div>${pct}%</div></div><h2>${pct>=80?'Strong finish.':pct>=60?'Good base. Keep sharpening.':'Review, recall, retry.'}</h2><p>${correct} of ${total} correct in Domain 0${state.quizDomain}.</p><div class="breakdown">${Object.entries(group).map(([k,v])=>`<div><b>${v.c}/${v.t}</b><span>${esc(k)}</span></div>`).join('')}</div><div class="result-actions"><button class="btn secondary" id="retryQuiz">Retry</button><button class="btn primary" id="shuffleQuiz">Shuffle & retry</button></div></article></div>`;retryQuiz.onclick=()=>startQuiz(state.quizDomain,false);shuffleQuiz.onclick=()=>startQuiz(state.quizDomain,true)}
function getFilteredCards(){return DATA.flashcards.map((c,i)=>({...c,_id:i})).filter(c=>!state.cardsFilter||c.domain===state.cardsFilter)}
function renderFlashcards(reset=false){if(reset||!state.cardOrder.length){state.cardOrder=getFilteredCards();state.cardIndex=0;state.flipped=false}let cards=state.cardOrder,c=cards[state.cardIndex];flashcards.innerHTML=`<div class="page-head"><div><p>Active recall</p><h1>Flashcards</h1><p>Think first. Flip second.</p></div></div><div class="filterbar"><div class="chips"><button class="chip ${state.cardsFilter===0?'active':''}" data-filter="0">All</button>${DATA.domains.map(d=>`<button class="chip ${state.cardsFilter===d.id?'active':''}" data-filter="${d.id}">D${d.id}</button>`).join('')}</div><button class="btn secondary" id="shuffleCards">Shuffle</button></div><div class="flash-stage"><div class="flashcard ${state.flipped?'flipped':''}" id="flashcard" tabindex="0" role="button" aria-label="Flip flashcard"><section class="face front"><span class="face-label">Term</span><span class="domain-dot">Domain ${c.domain}</span><h2>${esc(c.front)}</h2><span class="tap-hint">Tap to reveal</span></section><section class="face back"><span class="face-label">Definition</span><span class="domain-dot">Domain ${c.domain}</span><p>${esc(c.back)}</p><span class="tap-hint">Tap to return</span></section></div></div><div class="flash-controls"><button class="round-btn" id="prevCard" aria-label="Previous card">←</button><span class="flash-count">${state.cardIndex+1} / ${cards.length}</span><button class="round-btn" id="nextCard" aria-label="Next card">→</button></div><p class="key-hint">Use ← → keys to move · Space to flip</p>`;flashcards.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{state.cardsFilter=+b.dataset.filter;state.cardOrder=[];renderFlashcards(true)});flashcard.onclick=flipCard;flashcard.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flipCard()}};prevCard.onclick=()=>moveCard(-1);nextCard.onclick=()=>moveCard(1);shuffleCards.onclick=()=>{state.cardOrder=getFilteredCards().sort(()=>Math.random()-.5);state.cardIndex=0;state.flipped=false;renderFlashcards()};flashcard.addEventListener('pointermove',e=>{let r=flashcard.getBoundingClientRect();flashcard.querySelectorAll('.face').forEach(f=>{f.style.setProperty('--mx',e.clientX-r.left+'px');f.style.setProperty('--my',e.clientY-r.top+'px')})})}
function flipCard(){state.flipped=!state.flipped;flashcard.classList.toggle('flipped',state.flipped);let c=state.cardOrder[state.cardIndex];if(state.flipped){state.studied.add(c._id);updateSession()}}
function moveCard(n){let len=state.cardOrder.length;state.cardIndex=(state.cardIndex+n+len)%len;state.flipped=false;renderFlashcards()}
document.addEventListener('keydown',e=>{if(state.view!=='flashcards'||['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='ArrowLeft')moveCard(-1);if(e.key==='ArrowRight')moveCard(1);if(e.key===' '){e.preventDefault();flipCard()}})
function renderGlossary(){glossary.innerHTML=`<div class="page-head"><div><p>144 quick definitions</p><h1>Glossary</h1><p>Search the language of cybersecurity.</p></div></div><label class="search-wrap"><span class="sr-only">Search terms</span>${icons.terms}<input class="search" id="termSearch" placeholder="Search a term or definition…" autocomplete="off"></label><div class="glossary-list" id="termList"></div>`;termSearch.oninput=()=>paintTerms(termSearch.value);paintTerms('');termSearch.focus({preventScroll:true})}
function paintTerms(q){let s=q.toLowerCase().trim(),items=DATA.glossary.filter(x=>!s||x.term.toLowerCase().includes(s)||x.definition.toLowerCase().includes(s));termList.innerHTML=items.length?items.map((x,i)=>`<article class="term" style="animation-delay:${Math.min(i,12)*25}ms"><b>${esc(x.term)}</b><p>${esc(x.definition)}</p></article>`).join(''):`<div class="empty">No glossary terms match “${esc(q)}”.</div>`}
function renderCase(){const caseView=document.getElementById('case');caseView.innerHTML=`<div class="page-head"><div><p>JavaSip case study</p><h1>Security, told as a story</h1><p>Ten moments. Ten concepts worth remembering.</p></div></div><div class="timeline">${DATA.case_study.map(x=>`<article class="story reveal"><span class="story-num">${String(x.n).padStart(2,'0')}</span><div class="story-card"><h2>${esc(x.title)}</h2><span class="concept">${esc(x.concept)}</span><div>${md(x.body)}</div></div></article>`).join('')}</div>`;addEffects(caseView)}
renderNav();renderDashboard();updateSession();
</script>
</body></html>
