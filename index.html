<script id="study-data" type="application/json">{"domains": [{"id": 1, "name": "Security Principles", "notes": "# Domain 1: Security Principles — Study Notes\n### ISC2 CC (Certified in Cybersecurity) Exam Prep\n\n> These notes are paraphrased study notes (not copied course text), with extra explanations and examples added for clarity.\n\n---\n\n## 1. The CIA Triad\n\nThe CIA Triad is the foundation of all cybersecurity. Every security decision maps back to one of these three goals. Exam questions love giving you a scenario and asking \"which principle is violated here?\"\n\n**Confidentiality** — Only authorized people can access the information. Nobody else should see it.\n- *Example:* Your bank balance is visible to you, but not to a stranger. Encrypting a file protects confidentiality.\n- Protects things like PII (Personally Identifiable Information), PHI (Protected Health Information), and trade secrets.\n\n**Integrity** — Information stays complete, accurate, and unchanged unless an authorized person changes it.\n- *Example:* If someone secretly edits your medical record (changes your blood type), that's an integrity failure — and it could literally endanger your life.\n- Think: \"Is this data trustworthy and unmodified?\"\n\n**Availability** — Authorized users can access systems and data whenever they need them.\n- *Example:* A ransomware attack locks a hospital's systems until payment — that's an attack on availability. A crashed server during office hours is also an availability problem.\n\n**Quick memory trick:** C = \"who can SEE it\", I = \"is it CORRECT\", A = \"can I REACH it\".\n\n### Supporting terms (often tested)\n- **Sensitivity** — how important the information owner considers the data; decides how much protection it needs.\n- **Criticality** — how important an asset is, based on how often the business needs it.\n- **State** — the current condition of a system (secure or insecure).\n- **Baseline** — the known-good, expected secure state. You compare the current state against the baseline to detect changes.\n\n---\n\n## 2. Authentication — Proving You Are Who You Claim\n\nAuthentication = verifying that a person really is the owner of the identity they claim. (Identification says \"I am Ashu\"; authentication proves it.)\n\n### The three authentication factors\n| Factor | Meaning | Examples |\n|---|---|---|\n| Something you **know** | Knowledge factor | Password, passphrase, PIN |\n| Something you **have** | Possession factor | Smart card, token, phone, ATM card |\n| Something you **are** | Inherence factor | Fingerprint, face scan, iris scan |\n\n**Single-factor authentication** = only one method (e.g., just a password). Weak — if the password leaks, game over.\n\n**Multifactor authentication (MFA)** = two or more credentials, ideally from *different* factor categories. Much stronger.\n- *Classic example:* ATM — the **card** (something you have) + the **PIN** (something you know). The card alone is useless without the PIN.\n- *Modern example:* Password + fingerprint = know + are.\n\n**Exam trap:** Two passwords is NOT MFA (both are \"something you know\"). MFA needs different categories.\n\n### Non-repudiation\nA legal-flavored concept: **nobody can later deny they did something.**\n- It gives you proof that a specific person performed a specific action (sent a message, approved a document, made a purchase).\n- *Example:* You buy shoes online and later claim \"I never ordered that!\" — proper non-repudiation (like a digital signature) proves you did.\n- Especially important in e-commerce and electronic transactions.\n\n---\n\n## 3. Privacy\n\n**Privacy** = an individual's right to control how information about them is collected, used, and shared.\n\n**Privacy ≠ Security** (exam favorite). Security protects data from attackers; privacy is about the *rights* over personal data. You can have strong security but still violate privacy (e.g., a company with great firewalls that sells your data without consent). Security alone doesn't satisfy privacy laws.\n\n### Key laws\n- **GDPR (General Data Protection Regulation)** — EU law (2016). Treats privacy as a human right. Applies to **any organization anywhere in the world** that does business in the EU or handles data of people in the EU. Very strict, heavy fines.\n- **HIPAA (Health Insurance Portability and Accountability Act)** — US law protecting **medical/health information** privacy.\n- **US state laws** — several states have their own consumer data laws.\n- **Golden rule:** if you handle people's private data, you must follow the privacy laws of *their* jurisdiction, not just yours.\n\n### PII subtlety (nice exam point)\nA single data element might not be PII alone, but a **combination** can be. A date of birth alone is shared by thousands of people — not PII. Name + date of birth together = identifies a person = PII.\n\n---\n\n## 4. Risk Management\n\n### Core vocabulary (memorize cold — heavily tested)\n- **Asset** — anything of value: hardware, software, data, people, reputation.\n- **Threat** — any potential danger to information or systems (a hacker, a flood, a fire).\n- **Threat actor** — the *who*: the person or entity that could launch the attack.\n- **Threat vector** — the *how*: the method/path the attacker uses (e.g., phishing email, open port).\n- **Vulnerability** — a weakness in an asset or safeguard that a threat could exploit (unpatched software, an unlocked door).\n- **Likelihood** — probability that a threat will actually exploit a vulnerability.\n- **Risk** — the combination: likelihood of a threat exploiting a vulnerability (+ its impact).\n\n*Analogy from the course:* Pickpockets in a tourist area are a **threat**; a distracted tourist wearing flashy jewelry is **vulnerable**; the pickpocket who targets you is the **threat actor**; their technique is the **threat vector**. They pick the easiest-looking target — attackers exploit apparent vulnerability.\n\n*Another one:* A storm is the **threat**, a flood-prone power supply is the **vulnerability**, the IT systems are the **asset**. Storm floods the power → servers go down → availability hit.\n\n### The risk management process (4 steps, in order)\n1. **Frame** risk — decide how you'll approach risk (context, scope).\n2. **Assess** risk — identify and analyze.\n3. **Respond** to risk — do something about it.\n4. **Monitor** risk — keep watching; risk never sleeps.\n\n### Risk assessment: Qualitative vs Quantitative\n| | Qualitative | Quantitative |\n|---|---|---|\n| Style | Subjective, opinion-based | Objective, numbers-based |\n| Used when | Hard data isn't available | You have real metrics |\n| Output | Low / Medium / High ratings | Dollar values, formulas |\n\n**Quantitative terms (know the names):**\n- **EF** — Exposure Factor\n- **SLE** — Single Loss Expectancy\n- **ARO** — Annualized Rate of Occurrence\n- **ALE** — Annualized Loss Expectancy\n- **TCO** — Total Cost of Ownership\n- **ROI** — Return on Investment\n\n### Risk treatment — the 4 options (memorize with examples)\n1. **Avoid** — stop doing the risky activity entirely. (*Example:* shut down the vulnerable legacy server.)\n2. **Accept** — do nothing; live with the risk. Chosen when fixing it costs more than the risk itself.\n3. **Mitigate** — reduce the likelihood or impact (add controls). The most common answer in practice.\n4. **Transfer** — shift the risk to someone else. *Classic example:* buying **cyber insurance**.\n\n### Risk tolerance, appetite, residual risk\n- **Risk tolerance** — how much risk the organization is willing to live with. Varies by company (a bank: low tolerance; a startup: higher).\n- **Risk appetite** — closely related: how much risk it *wants* to take for reward.\n- **Residual risk** — the risk **left over after** you apply controls. Goal: get residual risk *within* risk tolerance.\n- *Example:* three choices — spend $0 and accept the risk, spend $5,000 on a control, or spend $10,000. All can be \"correct\" — it depends on the organization's risk tolerance.\n\n### Risk priorities\nFocus effort where **likelihood AND impact are both high**. Low/low risks can simply be accepted. And a **cost-effectiveness rule**: a control must not cost more than the risk it reduces.\n\n### Reporting\nAfter assessing, results go into a **risk assessment report**, presented to **senior management**, who decide the response. Risk handling must align with the organization's **mission and objectives**.\n\n---\n\n## 5. Security Controls\n\n**Security control** = a safeguard or countermeasure that protects the CIA of a system and its information.\n\n### By implementation type (the \"what is it made of\")\n1. **Technical (logical)** — enforced by hardware/software: firewalls, antivirus, encryption, passwords, IDS.\n2. **Administrative (managerial)** — people and paper: policies, procedures, standards, hiring practices, background checks, security awareness training.\n3. **Physical** — tangible things: fences, locks, badge readers, lighting, security cameras/guards.\n\n### By purpose/function (the \"what does it do\")\n| Control | Purpose | Examples |\n|---|---|---|\n| **Preventive** | Stops the bad thing from happening | Locks, firewalls, job rotation |\n| **Detective** | Spots it while/after it happens | CCTV, IDS (Intrusion Detection System) |\n| **Corrective** | Fixes/recovers afterward | Data backups, incident recovery |\n| **Deterrent** | Scares attackers off | Warning signs, visible guards |\n| **Compensating** | Backup option when the ideal control isn't possible | Alternative safeguard |\n| **Directive** | Tells people what to do | Policies and procedures |\n\n**Key exam link:** A firewall is a **technical + preventive** control (blocks bad traffic). An IDS is **detective** (notices the firewall missed something). A backup is **corrective** (restores after damage). And **all administrative controls are directive controls** — policies direct employee behavior.\n\n---\n\n## 6. Governance Elements — The Hierarchy\n\n**Governance** = how the board and executives set direction, manage risk, and make sure objectives are met.\n\n### The hierarchy (top to bottom — memorize this order)\n**Law → Regulation → Policy → Standard → Procedure / Guideline**\n\n1. **Laws** — made by governments/legislatures. Mandatory. Breaking them = criminal prosecution or fines.\n2. **Regulations** — rules from government agencies or standards bodies. Mandatory compliance; non-compliance = legal action and heavy fines.\n3. **Policies** — high-level statements of management intent (\"we take privacy seriously\"). Made by **senior management**, approved by the **board**, **reviewed annually**. Mandatory for everyone in the org.\n4. **Standards** — mandatory detailed requirements supporting a policy. *Example:* the encryption standard says exactly which algorithms are allowed and how keys are created, stored, and managed.\n5. **Procedures** — step-by-step instructions for carrying out policies. Mandatory actions.\n6. **Baselines** — minimum acceptable security levels; a consistency reference point (\"every laptop must have at least this configuration\").\n7. **Guidelines** — recommendations and best practices. **NOT mandatory** — flexible guidance.\n\n**Exam traps:**\n- Policies are reviewed **annually** and approved by the **board**.\n- Standards = mandatory; Guidelines = optional. Don't mix them up.\n- If a question asks \"which is NOT mandatory\" → guideline.\n\n---\n\n## 7. ISC2 Code of Ethics\n\nAll ISC2 members must follow it — **strict adherence is a condition of certification**.\n\n- **Preamble** — the spirit: act for the safety and welfare of society and the common good; hold yourself to the highest ethical standards.\n- **Canons** — the four duties, **in this order** (order matters for the exam):\n  1. **Protect society**, the common good, public trust, and the infrastructure.\n  2. **Act honorably, honestly, justly, responsibly, and legally.**\n  3. Provide **diligent and competent service** to principals (your employers/clients).\n  4. **Advance and protect the profession.**\n\n**Why the order matters:** if duties conflict, #1 wins. *Example from the course:* a company used retinal scanners (which can reveal sex/pregnancy) to secretly discriminate against female hires — violates canon #2 (act honorably, honestly, justly, responsibly, legally).\n\n*Second scenario:* a network admin used his monitoring permissions to spy on a coworker over a personal grudge and report a minor policy violation. Even though the user broke a policy, the **admin is punished more severely** — he abused trusted authority for personal reasons, violating the Code. Lesson: permissions must be used objectively, never for personal grievances.\n\n---\n\n## Practice Questions — Domain 1\n\n**Q1.** A ransomware attack encrypts a company's file server and demands payment to restore access. Which CIA principle is primarily attacked?\na) Confidentiality\nb) Integrity\nc) Availability\nd) Non-repudiation\n\n**Q2.** An attacker secretly modifies data in a customer database. Which principle is violated?\na) Availability\nb) Integrity\nc) Authentication\nd) Privacy\n\n**Q3.** You log in to your bank with a password, then approve the login with a fingerprint scan on your phone. This is an example of:\na) Single-factor authentication\nb) Multifactor authentication (something you know + something you are)\nc) Biometric authentication only\nd) Two passwords\n\n**Q4.** An ATM requires both your card and your PIN. Which factors are these?\na) Something you are + something you know\nb) Something you have + something you know\nc) Something you have + something you have\nd) Something you know + something you know\n\n**Q5.** A customer buys a laptop online and later denies making the purchase. Which concept provides proof that they did?\na) Authentication\nb) Non-repudiation\nc) Availability\nd) Risk tolerance\n\n**Q6.** Which law gives EU residents control over what personal data companies collect about them, and applies even to non-EU companies doing business in the EU?\na) HIPAA\nb) GDPR\nc) SOX\nd) GLBA\n\n**Q7.** HIPAA primarily protects:\na) Financial records\nb) Medical/health information in the US\nc) Children's online data\nd) Government classified data\n\n**Q8.** A flood-prone basement houses the company's servers. The flood is the ______, the basement location is the ______, and the servers are the ______.\na) vulnerability / threat / asset\nb) threat / vulnerability / asset\nc) risk / threat / vulnerability\nd) asset / risk / threat\n\n**Q9.** A company buys cyber insurance to handle the financial impact of a potential breach. This is:\na) Risk avoidance\nb) Risk acceptance\nc) Risk mitigation\nd) Risk transference\n\n**Q10.** The risk that remains after security controls are implemented is called:\na) Inherent risk\nb) Residual risk\nc) Risk appetite\nd) Control risk\n\n**Q11.** An IDS (Intrusion Detection System) that alerts on suspicious traffic is what type of control?\na) Preventive\nb) Detective\nc) Corrective\nd) Deterrent\n\n**Q12.** Regular data backups are what type of control?\na) Preventive\nb) Detective\nc) Corrective\nd) Directive\n\n**Q13.** A firewall is best described as which combination?\na) Administrative + detective\nb) Technical + preventive\nc) Physical + corrective\nd) Administrative + directive\n\n**Q14.** Which of the following is NOT mandatory?\na) Standard\nb) Policy\nc) Guideline\nd) Regulation\n\n**Q15.** Company policies must be approved by ______ and reviewed ______.\na) IT staff / monthly\nb) The board / annually\nc) Auditors / quarterly\nd) Employees / never\n\n**Q16.** Put in correct hierarchical order: Policy, Law, Standard, Regulation\na) Policy → Standard → Regulation → Law\nb) Law → Regulation → Policy → Standard\nc) Regulation → Law → Standard → Policy\nd) Standard → Policy → Law → Regulation\n\n**Q17.** According to the ISC2 Code of Ethics, the FIRST canon (highest priority) is to:\na) Advance and protect the profession\nb) Provide diligent service to principals\nc) Protect society and the common good\nd) Act honorably and legally\n\n**Q18.** Qualitative risk analysis differs from quantitative because it:\na) Uses dollar values and formulas\nb) Is subjective and rates risk as low/medium/high\nc) Calculates ALE and SLE\nd) Requires complete historical data\n\n**Q19.** All administrative controls can also be classified as:\na) Preventive controls\nb) Detective controls\nc) Directive controls\nd) Technical controls\n\n**Q20.** A hospital changes a patient's allergy information without authorization, putting the patient at risk. This is primarily a failure of:\na) Confidentiality\nb) Integrity\nc) Availability\nd) Authentication\n\n### Answers\n1-c, 2-b, 3-b, 4-b, 5-b, 6-b, 7-b, 8-b, 9-d, 10-b, 11-b, 12-c, 13-b, 14-c, 15-b, 16-b, 17-c, 18-b, 19-c, 20-b\n\n---\n\n---\n\n## Real Course Questions — Domain 1 (extracted from the course, read-only)\n\nThese are the actual knowledge-check questions from the course's learning history. Correct answers marked from the course material (**Q12 flagged — verify while studying**).\n\n**Q1.** What role might security professionals play in risk assessment at a system level?\na) Ignoring risk assessment activities · b) Solely focusing on strategic plans · c) Delegating risk assessment to employees · **d) Assisting in risk assessment at a system level** ✓\n\n**Q2.** Which regulation grants data protection and control to individuals within the EU, regardless of citizenship?\na) HIPAA · b) ISO · **c) GDPR** ✓ · d) Data Security and Compliance Act\n\n**Q3.** What action is suggested to mitigate the risk associated with a threat?\na) Ignore the threat · b) Strengthen the vulnerability · **c) Evaluate the likelihood of the event and take appropriate actions to mitigate the risk** ✓ · d) Increase the likelihood\n\n**Q4.** Who is responsible for determining risk tolerance in an organization?\na) All employees · **b) Executive management and board of directors** ✓ · c) External consultants · d) The risk management team\n\n**Q5.** What is an \"asset\" in risk management terminology?\na) Something aiming to exploit a vulnerability · b) Actionable information · c) A gap in protection · **d) Something in need of protection** ✓\n\n**Q6.** What is meant by non-repudiation?\na) Prevents session replay attacks · b) Part of administrative controls' rules · c) Protects reputation from social media harm · **d) If a user does something, they can't later claim they didn't do it** ✓\n\n**Q7.** In e-commerce, what does non-repudiation protect against?\na) Unauthorized access · b) Identity theft · **c) Falsely denying transactions** ✓ · d) Data breaches\n\n**Q8.** In the United States, which act governs the privacy of medical information?\n**a) HIPAA** ✓ · b) FERPA · c) HITECH · d) GDPR\n\n**Q9.** During the certification exam you notice another candidate cheating. What should you do?\na) Yell at them · **b) Report the candidate to ISC2** ✓ · c) Call local law enforcement · d) Nothing\n\n**Q10.** Which three are fundamental principles in most security frameworks? (Select all that apply)\n**a) Something you are** ✓ · **b) Something you have** ✓ · c) Somewhere you are · **d) Something you know** ✓\n\n**Q11.** According to the code of ethics, what are information security professionals expected to uphold?\na) Efficient decision-making · **b) Be honorable, honest, just and responsible within legal conduct** ✓ · c) Creativity · d) Secrecy\n\n**Q12.** ⚠️ What potential risk can occur when a remote worker's laptop is left unattended or unlocked?\n**a) Accidental introduction of unauthorized software with malware** (likely ✓ — verify) · b) Corrupt workstation from power outage · c) Backup generator failure · d) Loss of internet connection\n\n**Q13.** What term refers to information that, combined with other data, significantly narrows the possibility of association with individuals?\na) LAD · **b) PII** ✓ · c) PIE · d) PII Fusion\n\n**Q14.** How do identity-theft-insurance companies manage their own financial risk?\na) Restricting claims · b) Always honoring payouts · **c) Calculating premium payments against potential payouts** ✓ · d) Charging low premiums\n\n**Q15.** If a pickpocket is a threat, what is their attack vector?\na) The crowded tourist spot · b) The stolen goods · c) Tourists · **d) Their technique and approach** ✓\n\n**Q16.** What is the purpose of implementing security controls in the risk management process?\na) Increase risk · b) Make attacks impossible · **c) Mitigate the risk to an acceptable level** ✓ · d) Eliminate all vulnerabilities\n\n**Q17.** Which region enacted comprehensive personal-privacy legislation in 2016?\na) Africa · b) Asia-Pacific · **c) European Union** ✓ · d) United States\n\n**Q18.** The concept of \"secrecy\" is most related to which foundational aspect of security?\n**a) Confidentiality** ✓ · b) Availability · c) Plausibility · d) Integrity\n\n---\n\n## Real Course Questions — Course Pre-assessment (21 answered, extracted read-only)\n\nThe course's pre-assessment is adaptive — only the 21 questions already answered could be read without submitting anything. The remaining ~79 unlock only by answering, so they're not accessible read-only. All below are Domain 1 concepts. (⚠️ = question text was truncated in extraction; answer is best-effort — verify while studying.)\n\n**Q1.** Security awareness instruction before using email (anti-phishing) is which kind of control?\na) Technical · **b) Administrative** ✓ · c) Physical · d) Finite\n\n**Q2.** Best control to prevent laptops being stolen from offices?\n**a) Physical** ✓ · b) Administrative · c) Obverse · d) Technical\n\n**Q3.** A bollard (post preventing vehicle entry) is which type of control?\na) Technical · **b) Physical** ✓ · c) Critical · d) Administrative\n\n**Q4.** Red lines painted on the ground prohibiting traffic near a runway exemplify which control?\n**a) Physical** ✓ · b) Technical · c) Critical · d) Administrative\n\n**Q5.** A software firewall preventing specific traffic types is which control?\na) Physical · **b) Technical** ✓ · c) Passive · d) Administrative\n\n**Q6.** ⚠️ Phrenal sells a used laptop in an online auction and estimates its value — demonstrates which concept?\na) Vulnerability · b) Risk inversion · c) Risk tolerance · d) Threat *(verify — text truncated)*\n\n**Q7.** Sophia bets on a roulette number in Las Vegas — an example of _________.\na) Transference · b) Avoidance · **c) Acceptance** ✓ · d) Mitigation\n\n**Q8.** ⚠️ Kerpak is asked to assess [truncated] — demonstrates which concept?\na) Transference · b) Mitigation · c) Acceptance · d) Avoidance *(verify — text truncated)*\n\n**Q9.** Within the organization, who can identify risk?\na) Senior management · b) The security manager · c) Any security team member · **d) Anyone** ✓\n\n**Q10.** Which poses the MOST risk?\na) Low-likelihood, high-impact · b) High-likelihood, low-impact · c) Low-likelihood, low-impact · **d) High-likelihood, high-impact** ✓\n\n**Q11.** Which would probably NOT be considered a threat?\na) External attacker · **b) A laptop with sensitive data on it** ✓ · c) Unintentional user damage · d) Natural disaster\n\n**Q12.** In risk management, something/someone that poses risk to an organization is a:\n**a) Threat** ✓ · b) Control · c) Asset · d) Fear\n\n**Q13.** In risk management, something a practitioner needs to protect is an:\n**a) Asset** ✓ · b) Vulnerability · c) Threat · d) Likelihood\n\n**Q14.** For which asset is integrity MOST important?\n**a) The file containing passwords used to authenticate users** ✓ · b) Marketing website color scheme · c) One frame of streaming video · d) Spell-check software\n\n**Q15.** For which system is availability MOST important?\na) Medical systems storing patient data · b) Museum art camera streams · c) Retail past-transaction records · **d) Medical systems monitoring ICU patients** ✓\n\n**Q16.** The EU law granting legal protections to individual privacy is:\n**a) The General Data Protection Regulation** ✓ · b) The Maastricht Treaty · c) The Schengen Agreement · d) The Privacy Human Rights Act\n\n**Q17.** A system recording which users performed transactions demonstrates:\na) MFA · **b) Non-repudiation** ✓ · c) Biometrics · d) Privacy\n\n**Q18.** An example of a \"Something you are\" factor:\na) Credit card at ATM · b) User ID · c) Password and PIN · **d) A photograph of your face** ✓\n\n**Q19.** An example of a \"Something you know\" factor:\n**a) Password** ✓ · b) Fingerprint · c) User ID · d) Iris scan\n\n**Q20.** ⚠️ Chad must ensure the information on the organization's public [truncated] — demonstrates:\na) Confirmation · b) Confidentiality · **c) Integrity** (likely ✓ — verify) · d) Availability\n\n**Q21.** ⚠️ Steve must devise a protective measure for ensuring that car [truncated] — most effective control type?\na) Physical · b) Nuanced · c) Administrative · d) Technical *(verify — text truncated)*\n\n> Note: Domains 4–5, the Final Assessment, JavaSip case study and Flash Cards show as \"Not started\" — their learning histories are empty. Their questions aren't accessible without answering, which we're deliberately not doing.\n\n---\n\n*Saved: 2026-09-19. Source: ISC2 CC Online Self-Paced Training, Domain 1 (paraphrased notes + original practice questions + real course questions extracted read-only).*\n", "questions": [{"stem": "An employee emails an unencrypted spreadsheet of customer names and phone numbers to their personal account. Which CIA principle is violated?", "options": ["Availability — the data can no longer be reached", "Integrity — the data may have been altered", "Confidentiality — the data was exposed to an unauthorized party", "Non-repudiation — the sender can deny sending it"], "answer": 2, "explanation": "confidentiality means only authorized parties can access information; sending customer data to a personal account breaks that.", "difficulty": "Straightforward"}, {"stem": "After downloading a software update, you check its published checksum and it does not match. Which principle is at risk?", "options": ["Availability", "Confidentiality", "Integrity", "Authentication"], "answer": 2, "explanation": "a checksum verifies data has not been altered; a mismatch means the file may be corrupted or tampered with — an integrity concern.", "difficulty": "Straightforward"}, {"stem": "A hospital installs backup generators so its patient-care systems stay online during a power outage. Which CIA goal do the generators primarily support?", "options": ["Confidentiality", "Integrity", "Availability", "Non-repudiation"], "answer": 2, "explanation": "generators keep systems reachable and usable — availability is \"can authorized users reach the system when they need it.\"", "difficulty": "Straightforward"}, {"stem": "A disgruntled system administrator copies the company's source code before resigning. In risk terminology, the administrator is the:", "options": ["Threat vector", "Vulnerability", "Threat actor", "Risk"], "answer": 2, "explanation": "the threat actor is the WHO — the person or entity that carries out (or could carry out) the attack.", "difficulty": "Straightforward"}, {"stem": "A small business realizes it cannot secure its old online payment portal, so it shuts the portal down entirely. This is an example of:", "options": ["Risk transference", "Risk mitigation", "Risk acceptance", "Risk avoidance"], "answer": 3, "explanation": "avoidance means stopping the risky activity altogether — no portal, no portal risk.", "difficulty": "Straightforward"}, {"stem": "After implementing all planned controls, the remaining risk is still above what the organization is willing to tolerate. What is the BEST next step?", "options": ["Accept the remaining risk and move on", "Apply additional controls or treatments to reduce the risk further", "Transfer the risk to employees", "Redefine the asset so the risk no longer applies"], "answer": 1, "explanation": "residual risk (what's left after controls) must be brought within risk tolerance; if it still exceeds tolerance, more treatment is needed.", "difficulty": "Medium"}, {"stem": "A risk analysis finds the Single Loss Expectancy (SLE) of a server-room flood is $50,000 and the Annualized Rate of Occurrence (ARO) is 0.5 (once every two years). What is the Annualized Loss Expectancy (ALE)?", "options": ["$100,000", "$25,000", "$50,000", "$25,500"], "answer": 1, "explanation": "ALE = SLE × ARO = $50,000 × 0.5 = $25,000.", "difficulty": "Straightforward"}, {"stem": "A team has no historical breach data, so it rates each risk as High, Medium, or Low based on expert judgment. This is:", "options": ["Quantitative risk analysis", "Qualitative risk analysis", "A business impact analysis", "Risk transference"], "answer": 1, "explanation": "qualitative analysis is subjective and uses descriptive ratings (low/medium/high) when hard numbers aren't available.", "difficulty": "Straightforward"}, {"stem": "\"All database administrators must follow these 14 numbered steps to rotate encryption keys each quarter.\" This document is a:", "options": ["Policy", "Standard", "Procedure", "Guideline"], "answer": 2, "explanation": "procedures are the mandatory step-by-step instructions for carrying out policies and standards.", "difficulty": "Medium"}, {"stem": "A company rule states: \"All customer data at rest must be encrypted with AES-256, and keys must be rotated every 90 days.\" This rule is a:", "options": ["Guideline", "Procedure", "Standard", "Law"], "answer": 2, "explanation": "standards are mandatory, detailed technical requirements that support a policy — they specify exactly how something must be done.", "difficulty": "Medium"}, {"stem": "The PCI DSS primarily applies to:", "options": ["Hospitals handling patient records", "Government agencies handling classified data", "Merchants and providers that process payment card transactions", "Schools handling student records"], "answer": 2, "explanation": "PCI DSS is the security standard for anyone who stores, processes, or transmits credit/debit card data.", "difficulty": "Straightforward"}, {"stem": "The Sarbanes-Oxley Act (SOX) is mainly concerned with:", "options": ["Protecting children's online privacy", "Regulating healthcare data breaches", "Accuracy of corporate financial reporting and executive accountability", "Securing federal government networks"], "answer": 2, "explanation": "SOX was passed to prevent corporate accounting fraud — it mandates accurate financial reporting and holds executives accountable.", "difficulty": "Straightforward"}, {"stem": "Which of the following is an ADMINISTRATIVE control?", "options": ["A firewall filtering inbound traffic", "A bollard blocking vehicle access", "Background checks during hiring", "An intrusion detection system"], "answer": 2, "explanation": "administrative controls are people-and-paper safeguards — policies, procedures, hiring practices, training. The rest are technical or physical.", "difficulty": "Straightforward"}, {"stem": "A sign reading \"This facility is under 24-hour video surveillance\" is primarily which type of control?", "options": ["Preventive", "Detective", "Corrective", "Deterrent"], "answer": 3, "explanation": "deterrent controls discourage attackers from acting in the first place — the sign aims to scare off wrongdoing, whether or not a camera is actually there.", "difficulty": "Straightforward"}, {"stem": "A legacy application cannot support multifactor authentication, so the company requires users to connect through an encrypted VPN and obtain manager approval before each session. This is a:", "options": ["Preventive control", "Directive control", "Compensating control", "Deterrent control"], "answer": 2, "explanation": "a compensating control is an alternative safeguard used when the ideal control isn't possible — here it offsets the missing MFA.", "difficulty": "Medium"}, {"stem": "A website requires a password AND the answer to a \"mother's maiden name\" security question. This is:", "options": ["Multifactor authentication", "Two-factor authentication", "Single-factor authentication used twice", "Biometric authentication"], "answer": 2, "explanation": "both the password and the security question are \"something you know\" — MFA requires factors from different categories, so this is still single-factor.", "difficulty": "Medium"}, {"stem": "Which mechanism BEST provides non-repudiation for a contract sent by email?", "options": ["Encrypting the email with the recipient's public key", "Password-protecting the attached document", "A digital signature created with the sender's private key", "Sending the email over TLS"], "answer": 2, "explanation": "a digital signature proves the specific sender created/sent the message, so they cannot later deny it — that is non-repudiation. Encryption alone only protects confidentiality.", "difficulty": "Medium"}, {"stem": "A company has excellent firewalls and encryption, but it sells customers' browsing habits to advertisers without consent. This is primarily a failure of:", "options": ["Security — the technical defenses are inadequate", "Availability — customers cannot access their data", "Privacy — individuals' rights over their personal data were violated", "Integrity — the browsing data was altered"], "answer": 2, "explanation": "privacy is about individuals' rights to control their personal information; strong security does not excuse using data in ways people didn't agree to.", "difficulty": "Medium"}, {"stem": "Which of the following is an example of PII?", "options": ["The company's annual revenue", "A public holiday date", "A driver's license number", "The weather forecast"], "answer": 2, "explanation": "PII is data that can distinguish or trace an individual's identity — a driver's license number does exactly that.", "difficulty": "Straightforward"}, {"stem": "Which of the following is an example of PHI?", "options": ["An employee's job title", "A product's serial number", "A patient's lab test results", "A company's tax ID"], "answer": 2, "explanation": "PHI (Protected Health Information) is health-related information about an individual — lab results qualify; the others are not health data.", "difficulty": "Straightforward"}, {"stem": "An employer asks a security professional to secretly monitor employees' personal messages to find union organizers. Following the ISC2 Code of Ethics, the professional should refuse because:", "options": ["Canon 4 (advance the profession) outranks the employer's request", "Canon 1 (protect society and the common good) takes priority over serving the employer", "Monitoring is always illegal", "The employees have not violated any policy"], "answer": 1, "explanation": "the canons are ordered — protecting society and the common good comes first, ahead of diligent service to the employer (Canon 3).", "difficulty": "Medium"}, {"stem": "Converting readable data into an unreadable form using an algorithm and a key is called:", "options": ["Hashing", "Decryption", "Encryption", "Encoding for storage efficiency"], "answer": 2, "explanation": "encryption transforms plaintext into ciphertext with a key; decryption reverses it. Hashing is one-way and uses no key.", "difficulty": "Straightforward"}, {"stem": "After a malware incident, an administrator rebuilds the server from a documented, known-good configuration image. That image represents the system's:", "options": ["Threat model", "Risk appetite", "Baseline", "Vulnerability scan"], "answer": 2, "explanation": "a baseline is the known-good, expected secure state — you compare the current state against it and restore to it after incidents.", "difficulty": "Medium"}, {"stem": "An organization has finished framing how it will approach risk (scope, context, methodology). According to the risk management process, what comes NEXT?", "options": ["Monitor risk", "Respond to risk", "Assess risk", "Transfer risk"], "answer": 2, "explanation": "the process order is Frame → Assess → Respond → Monitor; assessment (identifying and analyzing risks) follows framing.", "difficulty": "Medium"}, {"stem": "A proposed control costs $80,000 per year, but the risk it addresses has an ALE of $50,000. What is the BEST decision?", "options": ["Implement the control — any risk reduction is worth it", "Transfer the risk to employees", "Accept the risk — the control costs more than the risk itself", "Avoid the risk by shutting down the business unit"], "answer": 2, "explanation": "a control must be cost-effective — it should not cost more than the risk it reduces ($80,000 > $50,000 ALE), so accepting the risk is the rational choice.", "difficulty": "Tricky"}]}, {"id": 2, "name": "Incident Response, BC & DR", "notes": "# Domain 2: Incident Response, Business Continuity & Disaster Recovery — Study Notes\n### ISC2 CC (Certified in Cybersecurity) Exam Prep\n\n> Paraphrased study notes with extra explanations and examples. This domain is all about the **Availability** leg of the CIA triad — what happens when things go wrong.\n\n---\n\n## 1. Incident Terminology — Don't Mix These Up\n\nThese four terms are classic exam traps. Learn the differences precisely:\n\n| Term | Meaning | Example |\n|---|---|---|\n| **Event** | ANY observable occurrence in a system/network — harmless or not | User logs in, email sent, firewall blocks a packet |\n| **Adverse event** | An event with negative consequences | System crash, malware deletes data |\n| **Incident** | An event that actually or potentially **jeopardizes CIA** of a system/data, or violates security policy | Ransomware encrypts files; unauthorized access to customer data |\n| **Breach** | A **loss of control / unauthorized disclosure** of data — especially PII. (A type of incident with legal consequences) | Hacker steals 10,000 customer records |\n| **Intrusion** | The **unauthorized act of bypassing security** to gain access | Someone breaks through the firewall into the network |\n\n**Memory logic:** Every incident starts as an event, but not every event becomes an incident. A breach is what lawyers worry about; an intrusion is what the attacker *did* to get in.\n\n---\n\n## 2. Incident Response (IR)\n\n### Primary goal\n**Reduce the impact** of the incident on the organization and its business operations. (Not \"find who did it\" — that's secondary.)\n\n### The IR plan — 5 phases IN ORDER (memorize this sequence)\n1. **Preparation** — Get ready *before* anything happens. Create the IR policy, build the team, get management buy-in.\n2. **Detection and Analysis** — Spot the incident, report/log it, prioritize, decide \"is this really an incident?\"\n3. **Containment** — Isolate the damage. Short-term (pull the network cable NOW) vs long-term (apply a clean patch later). Also: **gather evidence** carefully if legal action might follow.\n4. **Eradication and Recovery** — Remove the cause (wipe malware, close the hole) and **restore systems to normal operation**.\n5. **Post-Incident Activity** — Lessons learned: find the **root cause**, figure out how to **prevent recurrence**, **document everything**.\n\n*Exam-style thinking:* \"The team has isolated the infected machines and is now removing the malware\" → which phase? Eradication. \"They're writing up what went wrong\" → Post-Incident Activity.\n\n### The IR team\n- A cross-functional team: **management, IT, HR, PR, legal** — everyone who's a stakeholder.\n- Key roles: executive sponsor, **incident manager** (coordinates the response, point of contact for management), technical lead, security analyst, communications lead, legal rep, HR rep.\n- The IR plan should be **tested at least annually**.\n\n---\n\n## 3. Business Continuity (BC)\n\n### The big picture — IR → BC → DR (in that order)\nWhen trouble hits, plans activate in sequence:\n1. **Incident Response plan** — handle the unexpected event, try to keep operating.\n2. **Business Continuity plan** — if the disruption is too big for IR, BC keeps **critical business functions running** (possibly at reduced capacity) *during* the crisis.\n3. **Disaster Recovery plan** — if all else fails, DR **restores IT systems and data** afterward.\n\n*Example:* A fire breaks out in the office. IR: evacuate, call fire brigade, contain. BC: move critical staff to the alternate site so customers still get served. DR: rebuild servers and restore data from backups.\n\n### Goal of BC\nKeep the **critical** parts of the business operating during a disruption — NOT full restoration of everything. Full restoration comes later.\n\n**Important:** BC needs serious money and people. Without **executive management support**, BC efforts will fail. (Exam loves this point.)\n\n### The 4 components of a BCP (in order)\n1. **Scope and plan initiation** — decide what the plan covers, get approval to start.\n2. **Business Impact Analysis (BIA)** — the most important part (see below).\n3. **BCP development** — write the actual plan.\n4. **Plan approval and implementation** — get sign-off, put it into action.\n\n### BIA and the three magic letters: MTD, RTO, RPO\nThe **Business Impact Analysis** identifies critical assets, critical processes, dependencies, and impacts — then sets recovery targets:\n\n- **MTD (Maximum Tolerable Downtime)** — the LONGEST the business can survive without this system before serious harm. The absolute deadline.\n- **RTO (Recovery Time Objective)** — how fast you must **restore the system** after an outage. (\"How long can we be down?\")\n- **RPO (Recovery Point Objective)** — how much **data loss** you can tolerate, measured as a point in time. (\"How far back can our backup be?\")\n\n**Relationship (exam favorite):** RTO and RPO must both be **shorter than MTD**.\n\n*Concrete example:* An online store's order system has MTD = 24 hours (beyond that, customers leave forever). RTO = 4 hours (systems back up within 4h). RPO = 1 hour (backups every hour, so at most 1 hour of orders is lost). 4h < 24h ✓, 1h < 24h ✓.\n\n### BCP testing — 5 types, from lightest to heaviest\n| Test | What happens |\n|---|---|\n| **Checklist review** | Send BCP copies to managers for review. Lightest. |\n| **Tabletop / structured walk-through** | Team sits in a meeting room and talks through the plan. |\n| **Simulation test** | Scenario exercise in a simulated environment. |\n| **Parallel test** | Run the BC plan **alongside** normal operations (no disruption). |\n| **Full interruption test** | Shut down the primary site, run from the alternate site. Most thorough — but most **disruptive and risky**. |\n\n---\n\n## 4. Disaster Recovery (DR)\n\n- **Goal:** minimize downtime and data loss; **resume normal operations as quickly as possible** after a disaster.\n- **DR is a subset of BC** — it focuses specifically on **restoring IT systems, infrastructure, and data**. (BC = keep the business running; DR = fix the technology.)\n- DRPs must be **regularly tested and updated** — an untested plan is just a document.\n\n*Real-world lesson (Hurricane Sandy, 2012):* companies **with** DRPs switched to backup sites quickly and survived; companies **without** them faced prolonged outages — some went out of business entirely.\n\n### DR documentation — different versions for different people\n- **Executive summary** — high-level overview for leadership.\n- **Checklists** — step-by-step action lists for DR team members (in chaos, people need checklists, not essays).\n- **Technical guides** — detailed instructions for IT to bring alternate sites online.\n- **Department-specific plans** and simple high-level docs for managers/PR (so they can communicate without bothering the recovery team).\n\n---\n\n## 5. Quick Comparison Table (exam gold)\n\n| | Incident Response | Business Continuity | Disaster Recovery |\n|---|---|---|---|\n| **When** | During the incident | During a major disruption | After the disaster |\n| **Focus** | Reduce impact, handle the event | Keep critical business running | Restore IT systems & data |\n| **Scope** | Security events | Whole business operations | Technology/infrastructure |\n\n---\n\n## Practice Questions — Domain 2\n\n**Q1.** What is the PRIMARY goal of incident response?\na) Identify and prosecute the attacker\nb) Reduce the impact of the incident on business operations\nc) Restore all systems to full capacity\nd) Determine the financial cost of the breach\n\n**Q2.** Put the incident response phases in the correct order:\na) Containment → Preparation → Detection → Eradication → Post-Incident\nb) Preparation → Detection and Analysis → Containment → Eradication and Recovery → Post-Incident Activity\nc) Detection → Preparation → Eradication → Containment → Post-Incident\nd) Preparation → Containment → Detection → Post-Incident → Eradication\n\n**Q3.** The IR team has isolated infected machines from the network but has not yet removed the malware. Which phase are they in?\na) Detection and Analysis\nb) Containment\nc) Eradication and Recovery\nd) Post-Incident Activity\n\n**Q4.** A firewall log shows a blocked connection attempt. No harm was done. This is best described as:\na) An incident\nb) A breach\nc) An event\nd) An intrusion\n\n**Q5.** An attacker successfully bypasses the firewall and gains unauthorized network access. This act is an:\na) Event\nb) Intrusion\nc) Adverse event only\nd) Risk\n\n**Q6.** Customer PII is stolen by an external attacker. This is a:\na) Event\nb) Breach\nc) Threat vector\nd) Vulnerability\n\n**Q7.** RTO must be:\na) Longer than MTD\nb) Shorter than MTD\nc) Equal to RPO\nd) Unrelated to MTD\n\n**Q8.** RPO measures:\na) How fast systems must be restored\nb) The maximum tolerable downtime\nc) The maximum acceptable data loss (point in time to recover to)\nd) The cost of recovery\n\n**Q9.** Which BCP test shuts down the primary site and is the most thorough but most disruptive?\na) Tabletop walk-through\nb) Parallel test\nc) Full interruption test\nd) Checklist review\n\n**Q10.** The Business Impact Analysis (BIA) is primarily used to:\na) Prosecute attackers\nb) Identify critical assets/processes and set recovery priorities and timeframes\nc) Install firewalls\nd) Train new employees\n\n**Q11.** Disaster Recovery is best described as:\na) The same as business continuity\nb) A subset of business continuity focused on restoring IT systems and data\nc) Only about insurance\nd) Preventing disasters from happening\n\n**Q12.** An IR plan should be tested:\na) Only after a real incident\nb) At least annually\nc) Every five years\nd) Never — testing causes incidents\n\n**Q13.** Who coordinates the incident response and serves as the point of contact for management?\na) Technical lead\nb) Incident manager\nc) PR representative\nd) External auditor\n\n**Q14.** Business continuity planning will most likely fail without:\na) Firewalls\nb) Executive management support\nc) Antivirus software\nd) A large IT team\n\n**Q15.** After containing an incident, the team writes a report on the root cause and how to prevent recurrence. This is:\na) Eradication\nb) Detection\nc) Post-Incident Activity\nd) Containment\n\n### Answers\n1-b, 2-b, 3-b, 4-c, 5-b, 6-b, 7-b, 8-c, 9-c, 10-b, 11-b, 12-b, 13-b, 14-b, 15-c\n\n---\n\n---\n\n## Real Course Questions — Domain 2 (extracted from the course, read-only)\n\nActual knowledge-check questions from the course's learning history, with correct answers from the course material (**Q8, Q9 flagged — verify while studying**).\n\n**Q1.** Who must provide support for business continuity planning efforts?\na) Frontline employees · b) Middle management · **c) Executive management or an executive sponsor** ✓ · d) External consultants\n\n**Q2.** What is the purpose of the Executive Summary in a Disaster Recovery Plan?\na) List department-specific plans · **b) Offer a high-level overview of the plan** ✓ · c) Checklist for critical team members · d) Detailed technical guidance\n\n**Q3.** Which of the following is very likely to be used in a disaster recovery (DR) effort?\na) Guard dogs · b) Contract personnel · **c) Data backups** ✓ · d) Anti-malware solutions\n\n**Q4.** What is the primary distinction between BCP and DRP?\n**a) DRP is about restoring IT, while BCP focuses on business operations** ✓ · b) BCP is about personnel actions, DRP restores IT and communications · c) BCP ensures sustainment, DRP builds security · d) They are interchangeable\n\n**Q5.** What is the FIRST phase in the components of an incident response plan?\na) Post-Incident Activity · b) Detection & Analysis · c) Containment · **d) Preparation** ✓\n\n**Q6.** What is a key outcome of a Business Impact Analysis (BIA)?\n**a) Identification of functions and dependencies** ✓ · b) Importance of customer service staff · c) Transition to permanent office space · d) Immediate effect on other areas\n\n**Q7.** Why are notification systems and call trees important in a BCP?\n**a) To alert personnel when the BCP is being enacted** ✓ · b) To focus on supply chain members · c) To disrupt emergency response agencies · d) To exclude vendors and customers\n\n**Q8.** ⚠️ What is the purpose of a \"red book\" in business continuity?\na) Backup copy of the BCP · b) Distributed to all employees · **c) Hard copy backup accessible outside the facility** (likely ✓ — verify) · d) Outlines routine task procedures\n\n**Q9.** ⚠️ What term is sometimes used interchangeably with \"incident management\"?\na) Crisis response · **b) Crisis Management** (likely ✓ — verify) · c) Safety management · d) Business continuity\n\n---\n\n*Saved: 2026-09-19. Source: ISC2 CC Online Self-Paced Training, Domain 2 (paraphrased notes + original practice questions + real course questions extracted read-only).*\n", "questions": [{"stem": "A system administrator notices a server has crashed and rebooted overnight, with no data loss. Which term BEST describes this occurrence?", "options": ["Incident", "Adverse event", "Breach", "Intrusion"], "answer": 1, "explanation": "The crash had negative consequences, but there is no evidence it jeopardized CIA or violated policy, so it is an adverse event, not yet an incident.", "difficulty": "Straightforward"}, {"stem": "The FIRST thing an organization should do when building incident response capability is:", "options": ["Purchase forensic tools", "Prepare an IR policy, team, and get management buy-in", "Hire an external pentest firm", "Write the post-incident report template"], "answer": 1, "explanation": "Preparation is phase one of the IR lifecycle; everything else happens after.", "difficulty": "Straightforward"}, {"stem": "During a malware outbreak, the security team disconnects the affected subnet from the rest of the network but has not yet cleaned the machines. This action belongs to which phase?", "options": ["Detection and Analysis", "Containment", "Eradication", "Recovery"], "answer": 1, "explanation": "Isolating the damage to stop it spreading is containment. Eradication (removing the malware) comes next.", "difficulty": "Straightforward"}, {"stem": "Which of the following is the PRIMARY purpose of the containment phase?", "options": ["Identify the attacker's identity", "Limit the damage and prevent the incident from spreading", "Restore services to users", "Calculate the financial loss"], "answer": 1, "explanation": "Containment is about stopping the bleeding; restoration is a later phase.", "difficulty": "Straightforward"}, {"stem": "An analyst is reviewing firewall and IDS logs to determine whether an alert represents a genuine incident. This activity is part of:", "options": ["Preparation", "Detection and Analysis", "Eradication and Recovery", "Post-Incident Activity"], "answer": 1, "explanation": "Spotting a potential incident, logging it, and deciding whether it is real is exactly this phase.", "difficulty": "Straightforward"}, {"stem": "After an incident, the team discovers the root cause was an unpatched web server and updates the patching procedure. This is an example of:", "options": ["Containment", "Eradication", "Post-Incident Activity (lessons learned)", "Detection"], "answer": 2, "explanation": "Finding the root cause and preventing recurrence is the hallmark of the final phase.", "difficulty": "Straightforward"}, {"stem": "The Security Operations Center (SOC) is BEST described as:", "options": ["A physical data center building", "A centralized team that monitors, detects, and analyzes security events", "An offsite backup facility", "A committee that writes security policies"], "answer": 1, "explanation": "The SOC is the organization's security nerve center for detection and response.", "difficulty": "Straightforward"}, {"stem": "Which role on the IR team serves as the coordinator and point of contact for senior management during an incident?", "options": ["Technical lead", "Incident manager", "Legal counsel", "PR representative"], "answer": 1, "explanation": "The incident manager coordinates the response and keeps management informed.", "difficulty": "Straightforward"}, {"stem": "Evidence collected after a security incident must be handled carefully to preserve:", "options": ["The backup schedule", "The chain of custody", "The RPO target", "The firewall rule set"], "answer": 1, "explanation": "Documenting who handled evidence, when, and how preserves its integrity for legal proceedings.", "difficulty": "Straightforward"}, {"stem": "Forensic analysis of a compromised laptop begins with:", "options": ["Immediately running antivirus on it", "Creating a bit-for-bit copy of the drive and working from the copy", "Deleting suspicious files", "Reinstalling the operating system"], "answer": 1, "explanation": "Working on a forensic image preserves the original evidence unchanged.", "difficulty": "Straightforward"}, {"stem": "What is the PRIMARY goal of business continuity planning?", "options": ["Restore every IT system to full operation", "Keep critical business functions operating during a disruption", "Prosecute attackers after a disaster", "Reduce insurance premiums"], "answer": 1, "explanation": "BC is about sustaining critical operations, not full restoration (that is DR's job).", "difficulty": "Straightforward"}, {"stem": "In the correct activation sequence, the plans are used in which order?", "options": ["DRP → BCP → IRP", "BCP → IRP → DRP", "IRP → BCP → DRP", "IRP → DRP → BCP"], "answer": 2, "explanation": "Respond to the incident first, keep the business running if the disruption is major, then restore IT systems.", "difficulty": "Straightforward"}, {"stem": "A flood destroys a company's primary data center. The IT team fails over to a hot site and restores servers from backup. Which plan is being executed?", "options": ["Incident Response Plan", "Business Continuity Plan", "Disaster Recovery Plan", "Risk Treatment Plan"], "answer": 2, "explanation": "Restoring IT systems, infrastructure, and data after a disaster is DR.", "difficulty": "Straightforward"}, {"stem": "Which of the following is a component of a BCP but NOT typically part of a DRP?", "options": ["Server restoration procedures", "Relocating critical staff to an alternate site", "Data backup schedules", "Network failover configuration"], "answer": 1, "explanation": "Moving people and sustaining business functions is BC; DR focuses on restoring technology.", "difficulty": "Straightforward"}, {"stem": "The Business Impact Analysis (BIA) is used to:", "options": ["Assign blame after an incident", "Identify critical processes, dependencies, and set recovery timeframes", "Select firewall vendors", "Conduct employee background checks"], "answer": 1, "explanation": "The BIA determines what matters most and how fast it must be recovered.", "difficulty": "Straightforward"}, {"stem": "A bank determines it can survive at most 8 hours without its online transaction system. This 8-hour limit is the:", "options": ["RTO", "RPO", "MTD (Maximum Tolerable Downtime)", "SLA"], "answer": 2, "explanation": "MTD is the absolute longest a process can be down before unacceptable harm occurs.", "difficulty": "Straightforward"}, {"stem": "A company's email system is backed up every 6 hours. If the system fails at 2:00 PM and the last backup was at noon, the maximum data loss is 2 hours. Which metric does this describe?", "options": ["RTO", "RPO", "MTD", "MTTR"], "answer": 1, "explanation": "RPO measures the maximum tolerable data loss, expressed as the point in time to which data must be recovered.", "difficulty": "Straightforward"}, {"stem": "Which statement about RTO, RPO, and MTD is TRUE?", "options": ["RTO and RPO must both be shorter than MTD", "MTD must be shorter than RTO", "RPO is always longer than MTD", "RTO and MTD are unrelated"], "answer": 0, "explanation": "Recovery objectives must fit inside the maximum tolerable downtime window.", "difficulty": "Straightforward"}, {"stem": "During BCP testing, the team runs the continuity procedures in parallel with normal operations without disrupting anything. This is a:", "options": ["Full interruption test", "Tabletop exercise", "Parallel test", "Checklist review"], "answer": 2, "explanation": "Running BC procedures alongside live operations, without shutting anything down, is the parallel test.", "difficulty": "Straightforward"}, {"stem": "Which BCP test method is the MOST thorough but also the most disruptive and risky?", "options": ["Checklist review", "Tabletop walk-through", "Simulation test", "Full interruption test"], "answer": 3, "explanation": "Shutting down the primary site and operating from the alternate site tests everything but risks real disruption.", "difficulty": "Straightforward"}, {"stem": "An earthquake, a ransomware attack, and a prolonged power outage are all examples of:", "options": ["Vulnerabilities", "Threat vectors", "Disasters that can trigger BC/DR plans", "Adverse events only"], "answer": 2, "explanation": "Natural, human-caused, and environmental disruptions can all activate continuity and recovery plans.", "difficulty": "Straightforward"}, {"stem": "A company keeps three copies of critical data: one on-site, one on an external drive taken offsite nightly, and one in the cloud. This strategy PRIMARILY supports:", "options": ["Faster incident detection", "Data availability during disaster recovery", "Stronger password policies", "Network segmentation"], "answer": 1, "explanation": "Multiple geographically separated backups ensure data can be restored even if one site is destroyed.", "difficulty": "Straightforward"}, {"stem": "Scenario: A help-desk technician receives a call that a workstation is behaving strangely — pop-ups, slow performance, unknown processes. What is the technician's BEST first action?", "options": ["Immediately wipe and reimage the machine", "Report the potential incident to the security team per the IR plan", "Ignore it until more machines are affected", "Try to trace the attacker's IP address personally"], "answer": 1, "explanation": "Reporting through established procedures (Detection and Analysis) comes before any remediation; wiping first would destroy evidence.", "difficulty": "Straightforward"}, {"stem": "Short-term containment differs from long-term containment in that short-term containment:", "options": ["Is slower but more permanent", "Involves immediate isolation actions, while long-term containment applies lasting fixes", "Requires management approval first", "Only applies to physical incidents"], "answer": 1, "explanation": "Short-term = pull the cable now; long-term = patch and harden so it cannot recur.", "difficulty": "Straightforward"}, {"stem": "⚠️ Tricky: A company successfully restores all servers from backup within its 4-hour RTO after a fire. However, the last backup was 12 hours old and the RPO was 2 hours. Which statement is TRUE?", "options": ["The recovery was fully successful because the RTO was met", "The recovery failed its objectives because the RPO was exceeded", "The MTD was violated", "The BIA was unnecessary"], "answer": 1, "explanation": "Meeting RTO (systems restored in time) does not excuse missing RPO: 12 hours of data loss far exceeds the 2-hour objective. Both targets must be met.", "difficulty": "Straightforward"}]}, {"id": 3, "name": "Access Control Concepts", "notes": "# Domain 3: Access Control Concepts — Study Notes\n### ISC2 CC (Certified in Cybersecurity) Exam Prep\n\n> Paraphrased study notes with extra explanations and examples. This domain is about **who gets in, to what, and how we enforce it**.\n\n---\n\n## 1. What Is Access Control?\n\n**Access control** = the collection of mechanisms that work together to protect an information system's assets by deciding **who can access what, and what they can do with it**.\n\nEvery access control answers three questions in order: **Identification** (who are you?) → **Authentication** (prove it) → **Authorization** (what are you allowed to do?). Monitoring adds **Accountability** (we can trace what you did).\n\n### Three categories of access controls\n| Category | Protects | Examples |\n|---|---|---|\n| **Physical** | People, buildings, hardware | Fences, locks, guards, CCTV, badge readers |\n| **Logical / Technical** | Information and systems (software/hardware enforced) | Passwords, biometrics, encryption, firewalls |\n| **Administrative** | Behavior of people (policies and processes) | Hiring practices, background checks, security awareness training |\n\n*Quick check:* a security guard at the server room door = physical. A password on the server = logical. The policy saying \"visitors must sign in\" = administrative.\n\n### Control purposes — quick recap (from Domain 1, still tested here)\nPreventive (stops), Detective (spots), Corrective (fixes), Deterrent (discourages), Compensating (backup plan), Directive (instructs — all administrative controls are directive).\n\n---\n\n## 2. Defense in Depth\n\n**No single security control is fully effective.** So we stack **multiple layers** — if one fails, the others still protect.\n\n*The castle analogy:* a medieval castle had a moat, drawbridge, portcullis, archers on the walls, and knights inside. Drain the moat? The archers still shoot. Break the drawbridge? The knights still fight. Each layer compensates for the failure of another.\n\n*Cybersecurity version:* firewall (layer 1) → IDS (layer 2) → strong passwords + MFA (layer 3) → encryption (layer 4). Breach the firewall and the IDS still detects you; bypass that and MFA still stops you.\n\n**Layers typically include:** physical security → network security → endpoint security → application security → data security.\n\n**Exam point:** defense in depth costs more and needs more resources — but it's worth it compared to the cost of a breach. It protects against **both internal and external** threats.\n\n---\n\n## 3. Least Privilege, Separation of Duties, and Privileged Accounts\n\n### Least privilege\nUsers (and processes, and devices) get **only the minimum access needed to do their job — nothing more**.\n- *Why:* a compromised account or a malicious insider can only do limited damage.\n- *Examples:* a regular employee gets a **standard user account**, not an admin account. A web server process runs with only the permissions it needs. Unnecessary services and ports are disabled.\n\n### Separation of Duties (SoD)\n**No single person should be able to complete a sensitive process alone.** Split critical tasks between people to prevent fraud and catch errors.\n- *Classic example:* the person who **approves** a purchase must NOT be the person who **processes the payment**.\n- *IT example:* the developer who **writes** code must NOT be the one who **deploys** it to production. The person who **requests** access must NOT be the one who **approves** it.\n\n### Privileged accounts & PAM\n**Privileged accounts** (administrator, root, service accounts) have elevated permissions — they can change configurations, read sensitive data, manage other accounts. That makes them **prime targets for attackers**.\n\n**Privileged Access Management (PAM) best practices:**\n1. **Limit** the number of privileged accounts (fewer targets).\n2. Require **strong authentication** (MFA) on them.\n3. **Monitor and audit** all privileged activity.\n4. **Rotate credentials** regularly.\n5. Use **just-in-time access** — elevated rights granted only when needed, for a limited time.\n6. **Never use privileged accounts for daily tasks** — use a standard account, elevate only when necessary.\n7. **Disable/remove** unnecessary privileged accounts; keep an **inventory** of all of them.\n\n---\n\n## 4. Physical Access Controls\n\nPhysical security is often the **first line of defense** — if an attacker can touch the server, all your software controls may be bypassed.\n\n**Common controls:** fences, walls, gates, locks and keys, lighting, security guards, alarm systems, CCTV cameras, badge/card access systems, biometric readers, visitor logs, turnstiles.\n\n**Mantrap** (exam favorite): a small room with **two interlocking doors** — the first must close before the second opens. Prevents **tailgating/piggybacking** (sneaking in behind an authorized person).\n\n**Biometric physical controls:** fingerprint, hand geometry, retina/iris scanners.\n\n**Scaling rule:** match control strength to area sensitivity — a data center/server room gets far stronger controls than a general office.\n\nPhysical controls by purpose: locks/fences = **preventive**; cameras/alarms = **detective**; warning signs/guards = **deterrent**.\n\n---\n\n## 5. Monitoring\n\n**Monitoring** = watching system and user activity (log reviews, CCTV, IDS, guard patrols) to detect suspicious behavior.\n\n- Primarily a **detective control** — it finds incidents in progress or after the fact.\n- You need a **baseline of normal behavior** first — otherwise you can't spot anomalies.\n- **Protect the logs themselves** from tampering (attackers delete logs to hide tracks).\n- Bonus effects: supports **accountability** (trace actions to people) and acts as a **deterrent** (people behave better when watched).\n\n---\n\n## 6. Logical Access Control Models — DAC vs MAC vs RBAC\n\nThis is the most heavily tested part of Domain 3. Learn the table cold:\n\n| | **DAC** (Discretionary) | **MAC** (Mandatory) | **RBAC** (Role-Based) |\n|---|---|---|---|\n| **Who decides?** | The **resource owner**, at their discretion | A **central authority**, based on labels | The **administrator**, based on job **roles** |\n| **How it works** | Owner grants access to others | Subjects have **clearances**, objects have **classifications** (Top Secret → Secret → Confidential → Unclassified); access only if clearance ≥ classification | Roles are created with needed permissions; users are assigned to roles |\n| **Flexibility** | High (flexible, easy) | Low (rigid) | Medium |\n| **Security** | Weaker — access spreads as owners share onward; hard to centrally control | Strongest — users **cannot** override labels, not even the file creator | Good — consistent, easy to manage |\n| **Used in** | Windows/Unix file permissions, Google Drive sharing (\"anyone with the link\") | Military, government, high-security environments | Companies — HR gets personnel files, Finance gets bank accounts |\n| **Example** | You share your document and let viewers re-share it | A \"Secret\" document can't be opened by someone with only \"Confidential\" clearance — even if they created it | New joiner gets the standard \"Employee\" role; on promotion, role changes |\n\n**RBAC details worth knowing:**\n- Perfect for **high staff turnover** and many people needing similar access.\n- **Privilege creep** (permissions creep): when someone temporarily gets extra permissions (e.g., a junior covering for a manager) and **keeps them** after the need ends — then the next hire inherits them too. Dangerous and common.\n- **Prevention:** never copy one user's profile to provision another; always build users from **standard roles**; review access regularly; remove role access when someone leaves the role.\n\n---\n\n## 7. Security Control Assessments\n\nA **security control assessment** = testing and evaluating controls to check they are implemented correctly, work as intended, and actually meet security requirements.\n\n- Run **periodically** as part of ongoing monitoring; results feed into **risk assessment** and continuous improvement.\n- Also verifies controls are **cost-effective** and meet organizational needs.\n\n**Three types:**\n1. **Self-assessments** — the organization checks itself.\n2. **Independent assessments** — internal team or external third party (more objective).\n3. **Automated assessments** — tools and software do the checking.\n\n**Methods used:** vulnerability scanning, penetration testing, compliance audits.\n\n---\n\n## Practice Questions — Domain 3\n\n**Q1.** Which access control category do \"security awareness training\" and \"background checks\" belong to?\na) Physical\nb) Logical\nc) Administrative\nd) Technical\n\n**Q2.** A fingerprint scanner on the server room door is:\na) A logical control\nb) A physical control\nc) An administrative control\nd) A directive control\n\n**Q3.** Defense in depth means:\na) Using one very strong firewall\nb) Using multiple layers of security so that if one fails, others still protect\nc) Physically guarding the data center\nd) Encrypting everything twice\n\n**Q4.** An accountant is given access only to the financial system, not to HR records or server configurations. This demonstrates:\na) Separation of duties\nb) Least privilege\nc) Defense in depth\nd) Mandatory access control\n\n**Q5.** The developer who writes application code is NOT allowed to deploy it to production; a separate release engineer does that. This is:\na) Least privilege\nb) Separation of duties\nc) Privileged access management\nd) Defense in depth\n\n**Q6.** In which access control model does the resource OWNER decide who gets access?\na) MAC\nb) RBAC\nc) DAC\nd) ABAC\n\n**Q7.** Under MAC, a user with \"Confidential\" clearance tries to open a document classified \"Secret\". What happens?\na) Access is granted because they have some clearance\nb) Access is denied — clearance must meet or exceed classification\nc) Access is granted with read-only rights\nd) The owner is asked for permission\n\n**Q8.** Which access control model is BEST suited for an organization with high staff turnover where many people need similar access?\na) DAC\nb) MAC\nc) RBAC\nd) None — manual assignment\n\n**Q9.** A junior employee temporarily given manager permissions keeps them permanently, and the next junior hire inherits them. This is called:\na) Privilege escalation\nb) Privilege creep\nc) Role mining\nd) Access aggregation\n\n**Q10.** A mantrap (two interlocking doors) is designed to prevent:\na) Phishing\nb) Tailgating/piggybacking\nc) Malware infection\nd) Password guessing\n\n**Q11.** Reviewing system logs to detect suspicious activity is primarily which type of control?\na) Preventive\nb) Detective\nc) Corrective\nd) Physical\n\n**Q12.** Which is NOT a PAM best practice for privileged accounts?\na) Limiting the number of privileged accounts\nb) Requiring MFA on privileged accounts\nc) Using the admin account for daily email and browsing\nd) Rotating privileged credentials regularly\n\n**Q13.** Just-in-time privileged access means:\na) Admin rights are permanent\nb) Elevated access is granted only when needed and for a limited time\nc) Passwords never expire\nd) Everyone gets admin rights eventually\n\n**Q14.** Which assessment type is performed by an external third party?\na) Self-assessment\nb) Independent assessment\nc) Automated assessment\nd) Peer review\n\n**Q15.** Monitoring provides accountability and also acts as a ______ control because people behave better when watched.\na) preventive\nb) deterrent\nc) corrective\nd) compensating\n\n### Answers\n1-c, 2-b, 3-b, 4-b, 5-b, 6-c, 7-b, 8-c, 9-b, 10-b, 11-b, 12-c, 13-b, 14-b, 15-b\n\n---\n\n---\n\n## Real Course Questions — Domain 3 (extracted from the course, read-only)\n\nActual knowledge-check questions from the course's learning history, with correct answers from the course material.\n\n**Q1.** What is user provisioning in identity management?\na) Enabling account deletion · b) Ensuring antivirus scans · c) Letting users control what they access · **d) Managing access to resources and information systems** ✓\n\n**Q2.** Why disable accounts for a period before deletion when an employee leaves?\n**a) To preserve the integrity of audit trails or files** ✓ · b) So the ex-employee can't steal secrets · c) To allow the ex-employee data access · d) To speed up deletion\n\n**Q3.** What is the key feature of just-in-time privileged access management?\na) Permanent admin access · **b) Role-based subsets of privileges** ✓ · c) Unrestricted access · d) Static privileges\n\n**Q4.** What term describes inheriting expanded permissions not appropriate for one's role in RBAC?\na) Access overflow · b) Role deviation · c) Permissions anomaly · **d) Privilege creep** ✓\n\n**Q5.** In what environment does RBAC work well?\na) Limited access for all · b) Single person, unique needs · **c) High-staff turnover and similar access requirements** ✓ · d) Low-staff turnover\n\n**Q6.** What alternative control could replace biometric locks on multiple doors when auditing isn't needed?\na) Biometric scanners everywhere · b) A permanent wall · c) Removing doors · **d) Replacing doors with deadbolt locks** ✓\n\n**Q7.** What would be an administrative control in the context of seat belt usage?\na) Building a car with seat belts · b) Using the seat belt · c) Attaching the seat belt · **d) Passing a law requiring seat belt use** ✓\n\n**Q8.** Limiting access to data on the network is which type of control?\na) Virtualization · b) Administrative · c) Physical · **d) Logical or technical** ✓\n\n**Q9.** Which is an example of a logical access control method?\na) Turnstiles · **b) Biometrics on a smartphone** ✓ · c) Cameras · d) Security guards\n\n**Q10.** How does PAM implement the principle of least privilege?\n**a) By granting each user access only to the items they need** ✓ · b) Access based on seniority · c) Restricting to most critical info only · d) Maximum access for all\n\n**Q11.** What strategy integrates people, technology, and operations to establish variable barriers across multiple layers?\na) MFA · b) Cyberattack Prevention · c) Single Point of Failure · **d) Layered Defense** ✓\n\n**Q12.** Which of the following is a SUBJECT?\na) File · b) Fence · **c) User** ✓ · d) Filename\n\n**Q13.** Derrick logs on to a system to read a file. Derrick is the ______.\na) Predicate · **b) Subject** ✓ · c) Process · d) Object\n\n**Q14.** What is the definition of an OBJECT in access controls?\na) Device with firmware · **b) An entity that responds to a request for service** ✓ · c) Contains its own access logic · d) Initiates a request for service\n\n**Q15.** Which is an example of a security control?\na) Web browser · b) Computer mouse · c) Network cable · **d) Firewall** ✓\n\n---\n\n*Saved: 2026-09-19. Source: ISC2 CC Online Self-Paced Training, Domain 3 (paraphrased notes + original practice questions + real course questions extracted read-only).*\n", "questions": [{"stem": "Which of the following shows the correct order of the access control process?", "options": ["Authorization → authentication → identification", "Identification → authentication → authorization", "Authentication → identification → authorization", "Identification → authorization → authentication"], "answer": 1, "explanation": "first you claim an identity (identification), then you prove it (authentication), and only then does the system decide what you're allowed to do (authorization).", "difficulty": "Straightforward"}, {"stem": "When a user types their username on a login screen, they are performing:", "options": ["Authentication", "Authorization", "Identification", "Accounting"], "answer": 2, "explanation": "the username is a claim of identity. The proof (password, token) comes next — that's authentication.", "difficulty": "Straightforward"}, {"stem": "A password or PIN is an example of which authentication factor?", "options": ["Something you are", "Something you have", "Something you know", "Somewhere you are"], "answer": 2, "explanation": "passwords and PINs are memorized secrets — the \"know\" factor.", "difficulty": "Straightforward"}, {"stem": "A hardware security key plugged into a laptop to complete a login is an example of:", "options": ["Something you know", "Something you have", "Something you are", "Something you do"], "answer": 1, "explanation": "the physical key is a possession — the \"have\" factor, like a smart card or phone.", "difficulty": "Straightforward"}, {"stem": "A retina scan used to unlock a phone represents which authentication factor?", "options": ["Something you know", "Something you have", "Something you are", "Something you own"], "answer": 2, "explanation": "biometrics (fingerprint, face, retina, voice) are inherent traits — the \"are\" factor.", "difficulty": "Straightforward"}, {"stem": "A user logs in with a password and then approves a push notification on their phone. This is an example of:", "options": ["Single-factor authentication", "Two-factor authentication (2FA)", "Single sign-on", "Biometric authentication"], "answer": 1, "explanation": "two distinct factors are used — something you know (password) plus something you have (phone).", "difficulty": "Straightforward"}, {"stem": "Single sign-on (SSO) allows a user to:", "options": ["Log in once and access multiple applications", "Use the same password for ten years", "Share one account with the whole team", "Bypass authentication entirely"], "answer": 0, "explanation": "SSO centralizes authentication so one verified login opens many connected apps — reducing password fatigue.", "difficulty": "Straightforward"}, {"stem": "An access control list (ACL) on a shared folder is best described as:", "options": ["A list of firewall rules", "A table specifying which users have read, write, or execute rights to the folder", "A log of failed login attempts", "A list of blocked IP addresses"], "answer": 1, "explanation": "an ACL maps subjects (users/groups) to their permitted actions on an object — the classic enforcement table.", "difficulty": "Straightforward"}, {"stem": "Which of the following is a physical access control?", "options": ["A password policy", "A CCTV camera watching the server room", "An access control list", "Security awareness training"], "answer": 1, "explanation": "physical controls use tangible mechanisms (cameras, locks, guards); the others are logical or administrative.", "difficulty": "Straightforward"}, {"stem": "An employee is terminated on Friday afternoon. Their system access should be:", "options": ["Left active for 30 days in case they return", "Revoked immediately", "Transferred to their manager", "Downgraded at the next quarterly review"], "answer": 1, "explanation": "prompt deprovisioning removes the risk of a disgruntled former insider accessing systems.", "difficulty": "Straightforward"}, {"stem": "A new network switch arrives with the factory username \"admin\" and password \"admin\". The BEST action is to:", "options": ["Keep them for easy troubleshooting", "Change or disable the default credentials before deployment", "Share them with the whole IT team", "Write them on a label stuck to the device"], "answer": 1, "explanation": "default credentials are publicly documented and one of the most exploited attack vectors.", "difficulty": "Straightforward"}, {"stem": "The principle of least privilege states that users should be given:", "options": ["Full administrator rights for convenience", "Only the minimum access required to perform their job", "Access to everything except HR data", "The same access level as their manager"], "answer": 1, "explanation": "minimum necessary access limits the damage from a compromised account or malicious insider.", "diff
